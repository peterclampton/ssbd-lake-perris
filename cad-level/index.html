<body>
<div id="hud">
  <div id="title"><b>SSBD // Lake Perris</b><small>CAD MASTER LEVEL · DXF AUTHORITY</small></div>
  <div id="crosshair"></div>
  <div id="help"><kbd>WASD</kbd> fly · <kbd>Q/E</kbd> down/up · <kbd>arrows</kbd> look · <kbd>Shift</kbd> fast</div>
  <div id="panel">
    <h2>CAD Layers</h2>

  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c6ee);
scene.fog=new THREE.FogExp2(0xb9cde0,.00105);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.2,4000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.82; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfd9f1,0x596238,.82));
const sun=new THREE.DirectionalLight(0xffedcb,1.55); sun.position.set(180,300,140); sun.castShadow=true; scene.add(sun);
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:1,far:900});

// This is an actual world, not a CAD sheet sitting on two discs: a broad,
// irregular Lake Perris basin with low surrounding foothills, shoreline and a
// horizon-grade sky.  The surveyed festival pads remain flat and authoritative.
const WATER_LEVEL=-.22;
const terrainGeo=new THREE.PlaneGeometry(2300,2300,160,160);
const terrainPos=terrainGeo.attributes.position;
for(let i=0;i<terrainPos.count;i++){
  const x=terrainPos.getX(i),z=terrainPos.getY(i),r=Math.hypot(x,z);
  const basin=Math.max(0,(r-270)/650);
  const ridge=basin*basin*(18+10*Math.sin(x*.008)+7*Math.cos(z*.011)+5*Math.sin((x+z)*.015));
  const detail=basin*(2.8*Math.sin(x*.035)*Math.cos(z*.028)+1.3*Math.sin((x-z)*.07));
  terrainPos.setZ(i,Math.max(WATER_LEVEL-.05,ridge+detail-.2));
}
terrainGeo.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({color:0x9c875d,roughness:1}));
terrain.rotation.x=-Math.PI/2;terrain.receiveShadow=true;scene.add(terrain);
const grass=new THREE.Mesh(new THREE.CircleGeometry(330,128),new THREE.MeshStandardMaterial({color:0x587f42,roughness:.98}));
grass.rotation.x=-Math.PI/2;grass.position.y=.035;grass.receiveShadow=true;scene.add(grass);
const shore=new THREE.Mesh(new THREE.RingGeometry(330,420,128),new THREE.MeshStandardMaterial({color:0xcdbb83,roughness:1,side:THREE.DoubleSide}));
shore.rotation.x=-Math.PI/2;shore.position.y=WATER_LEVEL+.015;scene.add(shore);
const skyGeo=new THREE.SphereGeometry(1900,48,24);
const sky=new THREE.Mesh(skyGeo,new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color(0x2872b2)},bottom:{value:new THREE.Color(0xd9e9ee)}},vertexShader:'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform vec3 top;uniform vec3 bottom;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*.5+.5,0.,1.);gl_FragColor=vec4(mix(bottom,top,smoothstep(.04,.92,h)),1.);}'}));
scene.add(sky);
const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.32,depthWrite:false});
for(let i=0;i<34;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(12+(i%4)*7,12,8),cloudMat);const a=i*2.399;c.position.set(Math.cos(a)*(410+i%6*75),80+(i%5)*13,Math.sin(a)*(410+i%6*75));c.scale.z=.32;scene.add(c)}
// Native Lake Perris vegetation gives the festival edge depth and scale. Use
// shared geometry/materials so this is a proper live world, not a costly forest
// of cloned CAD placeholders.
const treeTrunkGeo=new THREE.CylinderGeometry(.22,.34,3.8,6),treeCrownGeo=new THREE.ConeGeometry(2.2,6.4,8);
const treeTrunkMat=new THREE.MeshStandardMaterial({color:0x62462d,roughness:1}),treeCrownMat=new THREE.MeshStandardMaterial({color:0x395b32,roughness:.95});
const trees=new THREE.Group();trees.name="LAKE PERRIS TREES";scene.add(trees);
for(let i=0;i<190;i++){
  const a=i*2.3999632297,r=245+(i%17)*16+((i*19)%23),x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(x>610&&z>560)continue;
  const h=.72+(i%7)*.075,g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=a*.37;g.scale.setScalar(h);
  const trunk=new THREE.Mesh(treeTrunkGeo,treeTrunkMat),crown=new THREE.Mesh(treeCrownGeo,treeCrownMat);trunk.position.y=1.9;crown.position.y=6.1;trunk.castShadow=crown.castShadow=true;trees.add(g);g.add(trunk,crown);
}
// The PDF places Lake Perris southeast of the festival core. In this CAD/world
// mirrored CAD/world transform that is +X/+Z.
const lake=new THREE.Mesh(new THREE.CircleGeometry(760,128),new THREE.MeshPhysicalMaterial({color:0x1d7898,roughness:.13,metalness:.08,transparent:true,opacity:.94,clearcoat:.35}));
lake.rotation.x=-Math.PI/2; lake.position.set(750,WATER_LEVEL,720); scene.add(lake);

const palette={
  "SCRIM 6' FENCE":0x17191d,"SCRIM 8' FENCE":0x111318,"Fence Line":0xbf342b,"Bike Rack":0x25a842,
  "Stages":0x272833,"Tents":0xf1eadb,"Stretch Tents":0xe9dfc4,"Food":0xf0a34a,"Vendors":0xdb4f93,
  "Porta Potties _ Bathroom Trucks":0x3f8ecb,"Parking":0x4a4a50,"Park Infrastructure":0xb7b1a2,
  "Fire Exits":0xe04c44,"Emergency Exits":0xe04c44,"Traffic":0xe8d059,"Sponsor Activations":0x6a61c7,"Preparty":0x42a89e
  ,"Camp Lanes":0xe7d067,"Trash":0x48555d,"Event-Worklight":0xe8d059,"Power-Parts-Supply":0xe7e1d6
};
const roots=new Map();
function rootFor(layer){
  if(!roots.has(layer)){const g=new THREE.Group();g.name=layer;roots.set(layer,g);scene.add(g)}
  return roots.get(layer);
}
// CAD geometry stays on and inspectable, but it is an alignment overlay—not a
// second opaque city rendered on top of the authored festival assets.
function material(layer){
  const fence=/FENCE|Bike Rack/.test(layer);
  return new THREE.MeshStandardMaterial({
    color:palette[layer]||0x6e7886,roughness:.78,metalness:fence?.32:0,
    transparent:!fence,opacity:fence?1:.18,depthWrite:fence
  });
}
function segment(a,b,height,width,mat,parent){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz); if(len<.03)return;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(width,height,len),mat);
  mesh.position.set((a[0]+b[0])/2,height/2,(a[1]+b[1])/2);mesh.rotation.y=Math.atan2(dx,dz);
  mesh.castShadow=mesh.receiveShadow=true;parent.add(mesh);
}
function shapeMesh(path,layer,parent){
  const pts=path.points;if(pts.length<3)return false;
  const shape=new THREE.Shape();shape.moveTo(pts[0][0],-pts[0][1]);for(let i=1;i<pts.length;i++)shape.lineTo(pts[i][0],-pts[i][1]);
  const heights={"Stages":2.2,"Tents":.22,"Stretch Tents":.18,"Food":2.4,"Vendors":2.25,"Porta Potties _ Bathroom Trucks":2.6,"Parking":.04,"Park Infrastructure":.4,"Sponsor Activations":1.2,"Preparty":.25};
  const geo=new THREE.ExtrudeGeometry(shape,{depth:heights[layer]||.12,bevelEnabled:false});
  geo.rotateX(-Math.PI/2);
  const mesh=new THREE.Mesh(geo,material(layer));mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return true;
}
function makeLabel(text,x,z){
  const cv=document.createElement("canvas"),c=cv.getContext("2d");c.font="700 28px Segoe UI";const w=Math.ceil(c.measureText(text).width)+28;
  cv.width=w*2;cv.height=78;c.scale(2,2);c.fillStyle="#162538dc";c.fillRect(0,0,w,39);c.fillStyle="white";c.textAlign="center";c.textBaseline="middle";c.font="700 14px Segoe UI";c.fillText(text,w/2,20);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  // Labels are survey aids, not billboards. The old 13m-wide cap obscured
  // whole structures from the Limitless spawn and made visual verification
  // impossible at ground level.
  s.scale.set(Math.min(3.9,w/46),.59,1);s.position.set(x,3.65,z);s.renderOrder=20;
  s.material.opacity=.66;rootFor("Labels").add(s);
}
function isUsefulLabel(t){return /STAGE|LIMITLESS|VIP|GATE|BAR|FOOD|VENDOR|RESTROOM|BATHROOM|SOLAR|ENTRANCE|PARKING|LOUNGE|TENT|ADA|PRODUCTION|HOSPITAL|CAMP|COCONUT|INNERBASS|BUTWOOD|CREATION|REVIVAL|GARDEN|PORTAL|ARTIST|FLOWER|GALLERY|DINER|STORE|COFFEE|GRIFFITH|MUSEUM|FASHION|PHONE|BALLOON|ISLAND|FERRY|PONTOON/i.test(t)}

// Detailed assets reuse the proportions, colors, truss language, shade
// structures and signage from the original SSBD level. Their anchors stay CAD.
const detail=rootFor("Detailed assets");
const M={
  dark:new THREE.MeshStandardMaterial({color:0x252631,roughness:.84}),
  truss:new THREE.MeshStandardMaterial({color:0x7a8390,roughness:.45,metalness:.62}),
  gold:new THREE.MeshStandardMaterial({color:0xd9b24a,roughness:.42,metalness:.48}),
  canvas:new THREE.MeshStandardMaterial({color:0xf1eadb,roughness:.88,side:THREE.DoubleSide}),
  wood:new THREE.MeshStandardMaterial({color:0x8b6844,roughness:.92}),
  pink:new THREE.MeshStandardMaterial({color:0xd9358f,roughness:.58,emissive:0x52112f,emissiveIntensity:.24}),
  blue:new THREE.MeshStandardMaterial({color:0x3f8ecb,roughness:.75})
};
function addBox(g,w,h,d,x,y,z,mat=M.dark){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;g.add(m);return m}
function addPost(g,x,z,h=4,mat=M.truss){return addBox(g,.18,h,.18,x,h/2,z,mat)}
function peakedTent(x,z,w,d,rot,color=0xf1eadb){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const mat=color===0xf1eadb?M.canvas:new THREE.MeshStandardMaterial({color,roughness:.86,side:THREE.DoubleSide});
  // A real frame tent has a hip canopy, valance, fabric panels and aluminium
  // legs. The old two-triangle roof was literally a debug primitive.
  const canopy=new THREE.Mesh(new THREE.ConeGeometry(1,2.15,4),mat);
  canopy.position.y=4.05;canopy.rotation.y=Math.PI/4;canopy.scale.set(w*.71,1,d*.71);canopy.castShadow=true;g.add(canopy);
  const valance=new THREE.MeshStandardMaterial({color:color===0xf1eadb?0xd7cfbe:color,roughness:.92,side:THREE.DoubleSide});
  addBox(g,w+.08,.34,.10,0,3.03,-d/2,valance);addBox(g,w+.08,.34,.10,0,3.03,d/2,valance);
  addBox(g,.10,.34,d+.08,-w/2,3.03,0,valance);addBox(g,.10,.34,d+.08,w/2,3.03,0,valance);
  // Three translucent back/side panels make the tent read as occupiable while
  // the local -Z side remains open toward the public path.
  const fabric=new THREE.MeshStandardMaterial({color:color===0xf1eadb?0xe6dfd0:color,roughness:.95,side:THREE.DoubleSide,transparent:true,opacity:.76});
  addBox(g,w*.96,2.7,.045,0,1.52,d/2-.03,fabric);
  addBox(g,.045,2.7,d*.96,-w/2+.03,1.52,0,fabric);addBox(g,.045,2.7,d*.96,w/2-.03,1.52,0,fabric);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3.08,M.truss);
  return g;
}
function stretchTentAsset(x,z,w,d,rot,color=0xe9dfc4){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const mat=new THREE.MeshStandardMaterial({color,roughness:.84,side:THREE.DoubleSide});
  const geo=new THREE.BufferGeometry(),verts=[],cols=8,rows=8;
  for(let iz=0;iz<=rows;iz++)for(let ix=0;ix<=cols;ix++){
    const px=(ix/cols-.5)*w,pz=(iz/rows-.5)*d;
    const nx=Math.abs(px)/(w/2),nz=Math.abs(pz)/(d/2);
    const y=3.15+2.35*(1-nx*nx)*(1-nz*nz)+.38*Math.sin(ix*Math.PI/cols)*Math.sin(iz*Math.PI/rows);
    verts.push(px,y,pz);
  }
  const idx=[];for(let iz=0;iz<rows;iz++)for(let ix=0;ix<cols;ix++){
    const a=iz*(cols+1)+ix,b=a+1,c=a+cols+1,d1=c+1;idx.push(a,c,b,b,c,d1);
  }
  geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();
  const canopy=new THREE.Mesh(geo,mat);canopy.castShadow=true;g.add(canopy);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3.15,M.truss);
  addPost(g,0,0,5.45,M.truss);return g;
}
function festivalStage(x,z,rot,w=24,d=13,butwood=false){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,1,d,0,.5,0,butwood?M.wood:M.dark);addBox(g,w,1.2,1,0,9,d/2-.5,butwood?M.wood:M.pink);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,9);
  addBox(g,w+.4,.24,.24,0,8.8,-d/2,M.truss);addBox(g,w+.4,.24,.24,0,8.8,d/2,M.truss);
  for(let i=-2;i<=2;i++){const lamp=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),new THREE.MeshStandardMaterial({color:0x26262e,emissive:i%2?0x20c8d8:0xd9358f,emissiveIntensity:2}));lamp.position.set(i*w/6,7.8,d/2+.2);g.add(lamp)}
  return g;
}
function rod(g,x1,y1,x2,y2,z,thick,mat){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),m=addBox(g,len,thick,thick,(x1+x2)/2,(y1+y2)/2,z,mat);
  m.rotation.z=Math.atan2(dy,dx);return m;
}
// Same Stage is deliberately its own model. The reference is a broad open
// scaffold wall, not the generic roofed festivalStage() box used in pass one.
function sameStageAsset(fp){
  // Exact minimum-area oriented footprint of DXF Stages/Group-70.
  const w=fp.width,d=fp.depth,h=fp.height;
  const g=new THREE.Group();g.name="THE SAME STAGE · CAD";
  g.position.set(fp.point[0],0,fp.point[1]);
  // The DXF is mirrored into player space; this dedicated facade must face the
  // lawn, not its backstage.  Generic footprint rotation was 180° wrong here.
  g.rotation.y=fp.rotation+Math.PI;detail.add(g);
  const orange=new THREE.MeshStandardMaterial({color:0xd58a27,roughness:.58,metalness:.34});
  const ivory=new THREE.MeshStandardMaterial({color:0xe8e4dc,roughness:.82});
  const black=new THREE.MeshStandardMaterial({color:0x101116,roughness:.7,metalness:.18});
  const screen=new THREE.MeshStandardMaterial({color:0x17131f,emissive:0x25103f,emissiveIntensity:.55,roughness:.5});

  addBox(g,w,1.15,d,0,.58,0,black);
  // A real stage needs a readable silhouette at festival distance.  The DXF
  // footprint remains authoritative; the roof, fascia, and screen simply give
  // its open scaffold the depth that was missing from the first CAD pass.
  const roof=addBox(g,w*.94,.42,d*.72,0,h*.76,-d*.03,black);
  roof.rotation.x=-.075;
  addBox(g,w*.90,1.05,.46,0,h*.69,d*.30,orange);
  addBox(g,w*.50,h*.39,.36,0,h*.275,d*.305,screen);
  const stageLogo=addBox(g,w*.27,1.18,.06,0,h*.70,d*.545,ivory);
  stageLogo.name="SAME STAGE FASCIA";

  // Curved scaffold wall: fewer, deliberately spaced bays keep the stage
  // legible instead of turning the player view into a picket fence.
  const wallZ=x=>d*.34-.018*x*x, wallH=x=>h*.74+Math.abs(x)*.11;
  for(let i=0;i<=10;i++){
    const bay=w/10,x=-w/2+i*bay,z=wallZ(x),wh=wallH(x);
    addBox(g,.16,wh,.16,x,wh/2,z,orange);
    for(let y=3.15;y<wh;y+=3.15)addBox(g,bay,.13,.13,x,y,z,orange);
    if(i<10&&i%2===0)rod(g,x,3.15,x+bay,6.3,z-.05,.12,orange);
    if(i<10&&i%2===1)rod(g,x,6.3,x+bay,3.15,z-.05,.12,orange);
  }

  // Patterned side towers: pale checker blocks with the black zigzag strokes
  // that define the real facade.
  for(const side of [-1,1]){
    const tx=side*w*.38;
    for(let c=0;c<4;c++)for(let r=0;r<7;r++){
      const pw=w*.063;
      const panel=addBox(g,pw,1.65,.28,tx+side*(c-1.5)*pw,2.1+r*1.68,wallZ(tx)-.35,
        (c+r)%3===0?black:ivory);
      panel.rotation.y=-side*.08;
    }
    const zx=side*w*.31;
    for(let k=0;k<6;k++){
      const y1=2.2+k*1.9,y2=y1+1.55;
      const run=w*.083;
      rod(g,zx+side*(k%2?0:run),y1,zx+side*(k%2?run:0),y2,wallZ(zx)-.7,.48,black);
    }
    // line array on the outside edge
    for(let j=0;j<8;j++)addBox(g,1.25,.56,1.05,side*(w/2-.7),h*.86-j*.63,d*.08+j*.08,black);
  }

  // Dense moving-light field across the scaffold and deck edge.
  const lampMatA=new THREE.MeshStandardMaterial({color:0x24252c,emissive:0x56d7ee,emissiveIntensity:1.8});
  const lampMatB=new THREE.MeshStandardMaterial({color:0x24252c,emissive:0xd9358f,emissiveIntensity:1.8});
  for(let i=0;i<20;i++){
    const x=-w*.43+(i%10)*(w*.86/9),y=3.0+Math.floor(i/10)*4.3+(i%3)*1.15;
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),i%2?lampMatA:lampMatB);
    lamp.position.set(x,y,wallZ(x)-.55);g.add(lamp);
  }
  for(let i=-5;i<=5;i++){
    const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.48,8),i%2?lampMatA:lampMatB);
    lamp.position.set(i*w/12,1.5,-d*.42);lamp.rotation.x=-.9;g.add(lamp);
  }
  makeLabel("THE SAME STAGE",fp.point[0],fp.point[1]);
  return g;
}
function limitlessAssets(data,deckFp,loungeFp){
  const deck=new THREE.Group();deck.position.set(deckFp.x,0,deckFp.z);deck.rotation.y=deckFp.rot;detail.add(deck);
  const deckW=32*.3048,deckD=20*.3048;
  addBox(deck,deckW,.36,deckD,0,4,0,M.dark);
  for(const [x,z] of [[-deckW*.41,-deckD*.4],[deckW*.41,-deckD*.4],[-deckW*.41,deckD*.4],[deckW*.41,deckD*.4],[0,0]])addPost(deck,x,z,3.9);
  for(const [x,z,w,d] of [[0,-deckD/2,deckW,.12],[-deckW/2,0,.12,deckD],[0,deckD/2,deckW,.12]])addBox(deck,w,.9,d,x,4.8,z,M.gold);
  const lounge=new THREE.Group();lounge.position.set(loungeFp.x,0,loungeFp.z);lounge.rotation.y=loungeFp.rot;detail.add(lounge);
  const loungeW=40*.3048,loungeD=20*.3048;
  addBox(lounge,loungeW,.22,loungeD,0,3.55,0,M.dark);

function flowerArchFromBoundary(data,anchor){
  if(!anchor)return null;
  // The PDF puts the FLOWER ARCH text outside the opening. Recover the actual
  // portal from the two nearest loose endpoints of its SCRIM boundary.
  const ends=[];
  for(const path of data.paths){
    if(!/SCRIM.*FENCE/.test(path.layer)||path.closed||path.points.length<2)continue;
    for(const p of [path.points[0],path.points[path.points.length-1]]){
      const dist=Math.hypot(p[0]-anchor.point[0],p[1]-anchor.point[1]);
      if(dist<12)ends.push({p,dist});
    }
  }
  let pair=null;
  for(let i=0;i<ends.length;i++)for(let j=i+1;j<ends.length;j++){
    const gap=Math.hypot(ends[i].p[0]-ends[j].p[0],ends[i].p[1]-ends[j].p[1]);
    if(gap<2||gap>8)continue;
    const score=ends[i].dist+ends[j].dist;
    if(!pair||score<pair.score)pair={a:ends[i].p,b:ends[j].p,gap,score};
  }
  if(!pair)return null;
  const x=(pair.a[0]+pair.b[0])/2,z=(pair.a[1]+pair.b[1])/2;
  const rot=Math.atan2(pair.b[0]-pair.a[0],pair.b[1]-pair.a[1]);
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;g.name="VIP FLOWER ARCH · CAD GAP";detail.add(g);
  const vine=new THREE.MeshStandardMaterial({color:0x3d7740,roughness:.92});
  const bloom=[0xf2a7c8,0xffd166,0xe9edf2].map(color=>new THREE.MeshStandardMaterial({color,roughness:.8}));
  const h=3.45;
  addBox(g,.22,h,.22,-pair.gap/2,h/2,0,vine);addBox(g,.22,h,.22,pair.gap/2,h/2,0,vine);
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(-pair.gap/2,h,0),new THREE.Vector3(0,h+1.35,0),new THREE.Vector3(pair.gap/2,h,0)
  ]);
  const crown=new THREE.Mesh(new THREE.TubeGeometry(curve,18,.14,8,false),vine);crown.castShadow=true;g.add(crown);
  for(let i=0;i<15;i++){
    const t=i/14,p=curve.getPoint(t),b=new THREE.Mesh(new THREE.SphereGeometry(.13+(i%3)*.035,7,6),bloom[i%3]);
    b.position.copy(p);b.position.z=(i%2?-.12:.12);g.add(b);
  }
  makeLabel("VIP FLOWER ARCH",x,z);
  return {x,z,width:pair.gap,rotation:rot};
}

  if(coveFohTent){
    fohAsset(coveFohTent.point[0],coveFohTent.point[1],coveFohTent.rotation,coveFohTent.width,coveFohTent.depth);
    makeLabel("COCONUT COVE FOH",coveFohTent.point[0],coveFohTent.point[1]);
  }else if(coveFohLabel)pdfSizedAsset(coveFohLabel,10,10,fohAsset,"COCONUT COVE FOH");
  const limitlessStep=data.inserts.find(i=>i.layer==="COLORMAPGOOD"&&i.name==="Symbol-1 (2D)"&&i.bounds)?.bounds;
  if(limitlessStep)eightInchStepAsset(limitlessStep);
  const balloonAnchor=anchor("HOT AIR BALLOON");
  const balloonZone=balloonAnchor?exactFootprint(data,balloonAnchor,"Traffic",55):null;
  if(balloonZone)hotAirBalloonAsset(balloonZone);
  const balloonRides=anchor("BALLOON RIDES / 10x10");
  if(balloonRides){
    peakedTent(balloonRides.point[0],balloonRides.point[1],10*.3048,10*.3048,balloonRides.rotation);
    makeLabel("BALLOON RIDES",balloonRides.point[0],balloonRides.point[1]);
  }

  // PDF-verified support footprints. These are dimension annotations placed
  // inside their rectangles in the CAD, so the annotation insertion supplies
  // center/rotation while the printed dimensions supply size.
  const pdfBlocks=[
    ["20 x 20",[-31.0424,-65.9352],20,20,"SUSTAINABILITY TENT","tent"],
    ["10 X 20",[122.9776,-92.6682],10,20,"GUEST SERVICES / ADA","service"],
    ["10 x 20",[118.2844,-76.6623],10,20,"ICE SALES","service"],
    ["20 x 20",[122.9066,-101.9584],20,20,"VOLUNTEER","tent"],
    ["10 x 20",[170.4453,-35.5087],10,20,"INNERSPACE GREEN ROOM","service"],
    ["10 x 20",[112.2525,-120.1887],10,20,"SECURITY HQ","service"],
    ["10 x 20",[-46.8326,147.2966],10,20,"BUT STAGE GREEN ROOM","service"],
    ["10 x 20",[94.2229,-66.8308],10,20,"PEER SUPPORT","tent"],
    ["20 x 20",[85.8825,-58.6118],20,20,"FIRST AID","tent"],
    // This is the CAD's 24' medical/support footprint, not a public
    // destination.  Keep it as a useful back-of-house asset without the
    // absurd "hospital storage" billboard that made it read like a feature.
    // Back-of-house footprint: present for CAD fidelity, but deliberately
    // unlabelled in the player-facing world. Medical services are represented
    // by the separately placed FIRST AID destination.
    ["24x24 / HOSP / STORAGE",[24.5239,3.8007],24,24,null,"service"],
    ["10 x 20",[27.0419,80.0681],10,20,"VIP BAR STORAGE","service"],
    ["10 x 20",[64.7082,22.0797],10,20,"BAR STORAGE","service"],
    ["10 x 20",[219.62,160.1731],10,20,"COCONUT COVE BAR STORAGE","service"],
    ["10 x 10",[103.5042,-41.742],10,10,"BAR 5 STORAGE","service"]
  ];
  for(const [text,near,w,d,label,kind] of pdfBlocks){
    const a=exactAnchor(text,near);if(!a)continue;
    if(kind==="tent"){
      peakedTent(a.point[0],a.point[1],w*.3048,d*.3048,a.rotation);
      makeLabel(label,a.point[0],a.point[1]);
    }
    else pdfSizedAsset(a,w,d,serviceAsset,label,0);
  }
  // Named businesses use the nearest closed CAD footprint, not their offset
  // annotation point. Seed the generic-placement dedupe list with them.
  const placed=[];
  const namedBusinesses=[
    ["SHINE DINER","SHINE / DINER","Food"],
    ["COFFEE","COFFEE","Food"],
    ["GENERAL STORE","STORE","Vendors"]
  ];
  for(const [label,text,layer] of namedBusinesses){
    const a=anchor(text),fp=a?exactFootprint(data,a,layer,12):null;
    if(!fp||placed.some(p=>Math.hypot(p[0]-fp.x,p[1]-fp.z)<2))continue;
    placed.push([fp.x,fp.z]);stallAsset(fp.x,fp.z,fp.rot,fp.w,fp.d,layer==="Food");
    makeLabel(label,fp.x,fp.z);
  }
  // Do not place a single stall beside a loose FOOD/VENDORS annotation. The
  // PDF shows discrete vendor pads; build every closed pad in those CAD layers
  // at its own position and orientation.
  const cadPads=layer=>data.paths.filter(path=>path.layer===layer&&path.closed)
    .map(pathFootprint).filter(fp=>fp&&fp.w>=2&&fp.d>=2&&fp.w<=16&&fp.d<=16);
  let foodIndex=0;
  for(const fp of cadPads("Food")){
    if(placed.some(p=>Math.hypot(p[0]-fp.x,p[1]-fp.z)<2))continue;
    placed.push([fp.x,fp.z]);foodVendorAsset(fp,foodIndex++);
  }
  let vendorIndex=0;
  for(const fp of cadPads("Vendors")){
    if(placed.some(p=>Math.hypot(p[0]-fp.x,p[1]-fp.z)<2))continue;
    placed.push([fp.x,fp.z]);stallAsset(fp.x,fp.z,fp.rot,fp.w,fp.d,false);vendorIndex++;
  }
  const productionAnchor=anchor("PRODUCTION");let dumpsterIndex=0;
  // Every remaining tent uses its closed DXF outline. The six white rectangles
  // directly behind Production Lot 9 are a dumpster bank in the PDF, not tents.
  // Skip the two named tents
  // above so they are not drawn twice.
  for(const path of data.paths){
    if(!path.closed||!(path.layer==="Tents"||path.layer==="Stretch Tents"))continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1.5||fp.d<1.5||fp.w>45||fp.d>45)continue;
    if(path.layer==="Tents"&&productionAnchor&&Math.hypot(fp.x-productionAnchor.point[0],fp.z-productionAnchor.point[1])<58){
      dumpsterAsset(fp,dumpsterIndex++);continue;
    }
    if(tentUsed(fp,8)||Math.hypot(fp.x-.9549,fp.z-112.7312)<8)continue;
    peakedTent(fp.x,fp.z,fp.w,fp.d,fp.rot,path.layer==="Stretch Tents"?0xe9dfc4:0xf1eadb);
  }
  // Block inserts carry their own CAD rotation and minimum-area bounds. These
  // cannot be placed from nearby labels: several labels are tens of metres away.
  for(const item of data.inserts){
    const fp=item.bounds;if(!fp||Math.abs(fp.point[0])>500||Math.abs(fp.point[1])>500)continue;
    if(/^Event Tent /i.test(item.name)){
      if(item.name==="Event Tent 40x60 Event 2 (2D)"||item.name==="Event Tent 40x60 Event (2D)")continue;
      if(coveFohTent===fp)continue;
      peakedTent(fp.point[0],fp.point[1],fp.width,fp.depth,fp.rotation);
    }else if(/^Vehicle Mobile Restroom Trailer/i.test(item.name)){
      restroomTrailer(fp.point[0],fp.point[1],fp.rotation,fp.width,fp.depth);
    }
  }
  // Every restroom/porto/hand-wash footprint is a literal closed CAD outline.
  // Style varies by physical size, but position, rotation, width and depth do not.
  const trailer=insert("Vehicle Mobile Restroom Trailer 3 Doors (2D)");
  const solarAnchor=anchor("SOLAR / x3");
  for(const path of data.paths){
    if(path.layer!=="Porta Potties _ Bathroom Trucks"||!path.closed)continue;
    const fp=pathFootprint(path);if(!fp||fp.w<=.01||fp.d<=.01||fp.w>18||fp.d>12)continue;
    if(Math.abs(fp.x)>500||Math.abs(fp.z)>500)continue;
    if(trailer&&Math.hypot(fp.x-trailer.point[0],fp.z-trailer.point[1])<6)continue;
    if(solarAnchor&&Math.hypot(fp.x-solarAnchor.point[0],fp.z-solarAnchor.point[1])<10&&fp.w>1.8)continue;
    if(photoBooth&&Math.hypot(fp.x-photoBooth.x,fp.z-photoBooth.z)<1)continue;
    restroomFootprintAsset(fp);
  }
  // Remaining CAD stage polygons are access decks or risers. Keep their literal
  // footprints without inventing another full-height stage roof.
  for(const path of data.paths){
    if(path.layer!=="Stages"||!path.closed)continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1.4||fp.d<1||fp.w>20||fp.d>15)continue;
    if(deck&&Math.hypot(fp.x-deck.x,fp.z-deck.z)<5)continue;
    if(innerStage&&Math.hypot(fp.x-innerStage.x,fp.z-innerStage.z)<5)continue;
    if(coconutStage&&Math.hypot(fp.x-coconutStage.x,fp.z-coconutStage.z)<5)continue;
    if(coconutBar&&Math.hypot(fp.x-coconutBar.x,fp.z-coconutBar.z)<3)continue;
    platformAsset(fp);
  }
  for(const path of data.paths){
    if(!path.closed||!(path.layer==="Sponsor Activations"||path.layer==="Preparty"))continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1||fp.d<1||fp.w>40||fp.d>40||Math.abs(fp.x)>500||Math.abs(fp.z)>500)continue;
    activationAsset(fp,path.layer==="Preparty"?0x7655b5:0xd9358f);
  }
  // Park buildings are real, dimensioned CAD polygons—not activation tents.
  // The PDF labels identify which existing structures are restrooms/HQ; the
  // unlabeled pavilion footprints are the mapped park gazebos.
  const parkFps=data.paths.filter(path=>path.layer==="Park Infrastructure"&&path.closed)
    .map(pathFootprint).filter(fp=>fp&&fp.w>=2&&fp.d>=2&&fp.w<=45&&fp.d<=45&&Math.abs(fp.x)<=500&&Math.abs(fp.z)<=500)
    .sort((a,b)=>b.w*b.d-a.w*a.d);
  const placedPark=[];
  for(const fp of parkFps){
    if(placedPark.some(p=>Math.hypot(p.x-fp.x,p.z-fp.z)<3))continue;
    placedPark.push(fp);
    const nearby=data.anchors.filter(a=>Math.hypot(a.point[0]-fp.x,a.point[1]-fp.z)<20).map(a=>a.text).join(" ");
    const kind=/BATHROOM|RESTROOM/i.test(nearby)?"restroom":/HQ|COMMISSARY|MEDIA RV|BONEYARD/i.test(nearby)?"service":"gazebo";
    parkBuildingAsset(fp,kind);
  }
}

// Signature destinations from the production level.  These are deliberately
// designed places—not anonymous CAD extrusions—and use the production map's
// surveyed coordinates while the CAD remains responsible for all event pads.
function restoreLegacyDestinations(data){
  const warm=new THREE.MeshStandardMaterial({color:0xe8d8b8,roughness:.94});
  const roof=new THREE.MeshStandardMaterial({color:0x914838,roughness:.9});
  const wood=new THREE.MeshStandardMaterial({color:0x8a6540,roughness:.95});
  const glass=new THREE.MeshStandardMaterial({color:0x8ebad4,roughness:.25,metalness:.25});
  function house(x,z,label,garage=false){
    const g=new THREE.Group();g.name=label;g.position.set(x,0,z);detail.add(g);
    addBox(g,garage?7.8:8,garage?3.25:3.7,garage?6.8:6.4,0,garage?1.62:1.85,0,warm);
    const r=new THREE.Mesh(new THREE.ConeGeometry(garage?5.7:6.4,garage?2.2:3,4),roof);r.position.y=garage?4.4:5.15;r.rotation.y=Math.PI/4;r.scale.z=.8;g.add(r);
    if(garage){const door=addBox(g,5.8,2.25,.12,0,1.2,3.42,new THREE.MeshStandardMaterial({color:0xb9c4ca,roughness:.55,metalness:.25}));door.rotation.x=.08;addBox(g,2.2,.9,4.6,1.3,.85,.4,new THREE.MeshStandardMaterial({color:0x4e7586,roughness:.55,metalness:.3}));}
    else {for(const sx of [-2.5,2.5])addBox(g,1.25,1.25,.08,sx,2.0,3.24,glass);addBox(g,2.35,2.35,.15,0,1.18,3.3,wood);addBox(g,5,.25,2.1,0,.18,4.15,wood);}
    makeLabel(label,x,z);
  }
  // These structures are still part of the experience, but the former values
  // came from an older world and placed them on the wrong beach. Their 2026
  // CAD labels are the placement authority.
  const grandma=data.anchors.find(a=>a.text==="GRANDMA’S");
  const grandpa=data.anchors.find(a=>a.text==="GRANDPA’S");
  if(grandma)house(grandma.point[0],grandma.point[1],"GRANDMA'S HOUSE");
  if(grandpa)house(grandpa.point[0],grandpa.point[1],"GRANDPA'S GARAGE",true);
  // Creation Station and the former artisan street were fabricated legacy
  // placements. Do not render them until their 2026 plan boundaries are
  // recovered; an absent asset is preferable to a confidently wrong one.
}

fetch("site-plan.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
  for(const path of data.paths){
    const layer=path.layer,parent=rootFor(layer),fence=/FENCE|Bike Rack/.test(layer);
    if(layer==="Group Camping"||layer==="But Area"||layer==="Stage-Main"||layer==="None"||layer==="CRASH BARRICADE"||layer==="COLORMAPGOOD")continue;
    if(path.closed&&!fence&&shapeMesh(path,layer,parent))continue;
    const h=layer==="SCRIM 8' FENCE"?2.45:layer==="Bike Rack"?1.05:fence?1.85:.18;
    const w=layer==="Bike Rack"?.08:fence?.11:.16,mat=material(layer);
    for(let i=1;i<path.points.length;i++){
      segment(path.points[i-1],path.points[i],h,w,mat,parent);
      // The red PDF perimeter is a physical waterfront boundary, not a thin
      // CAD stroke. Retain its exact segments and make its posts readable at
      // player height.
      if(layer==="Fence Line")addBox(parent,.22,h+.38,.22,path.points[i-1][0],(h+.38)/2,path.points[i-1][1],mat);
    }
  }
  const seen=[];for(const a of data.anchors){if(!isUsefulLabel(a.text))continue;if(seen.some(p=>Math.hypot(p[0]-a.point[0],p[1]-a.point[1])<2))continue;seen.push(a.point);makeLabel(a.text,a.point[0],a.point[1])}
  buildDetailedAssets(data);
  restoreLegacyDestinations(data);
  buildLayerPanel();
  document.querySelector("#status").textContent=`${data.stats.entities} DXF entities · ${data.stats.paths} paths · ${data.stats.anchors} labels`;
  festivalView();
}).catch(e=>document.querySelector("#status").textContent="CAD load failed: "+e.message);

function buildLayerPanel(){
  const box=document.querySelector("#layers");
  // The CAD level opens as a complete site, never as a selectively hidden
  // debugging view.  Detailed assets are deliberately layered over these
  // audited footprints; operators can still turn individual layers off while
  // investigating a placement, but nothing is silently absent on load.
  const hiddenByDefault=new Set();
  [...roots.keys()].sort().forEach(layer=>{const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=!hiddenByDefault.has(layer);
    roots.get(layer).visible=input.checked;
    input.onchange=()=>roots.get(layer).visible=input.checked;label.append(input,document.createTextNode(layer));box.append(label)});
}

let yaw=0,pitch=-.32;const keys={};
// Viewpoint requested by Peter: standing at Limitless and looking into the
// festival. Solar is behind; Butwood is right; food and East Entrance are left.
// Stand in the lawn rather than inside the Limitless structures: this is the
// first honest production-facing view and keeps the complete Same Stage in
// frame for every visual review.
function festivalView(){camera.position.set(-48,18,54);yaw=-1.22;pitch=-.14}
function overview(){camera.position.set(30,430,35);yaw=0;pitch=-Math.PI/2+.001}
document.querySelector("#overview").onclick=overview;document.querySelector("#spawn").onclick=festivalView;
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),dir=new THREE.Vector3(),right=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04),turn=1.25*dt;
  if(keys.ArrowLeft)yaw+=turn;if(keys.ArrowRight)yaw-=turn;if(keys.ArrowUp)pitch+=turn;if(keys.ArrowDown)pitch-=turn;
  pitch=THREE.MathUtils.clamp(pitch,-1.56,1.25);camera.rotation.order="YXZ";camera.rotation.set(pitch,yaw,0);
  camera.getWorldDirection(dir);right.crossVectors(dir,camera.up).normalize();const speed=(keys.ShiftLeft||keys.ShiftRight?95:30)*dt;
  if(keys.KeyW)camera.position.addScaledVector(dir,speed);if(keys.KeyS)camera.position.addScaledVector(dir,-speed);
  if(keys.KeyA)camera.position.addScaledVector(right,-speed);if(keys.KeyD)camera.position.addScaledVector(right,speed);
  if(keys.KeyE)camera.position.y+=speed;if(keys.KeyQ)camera.position.y-=speed;
  renderer.render(scene,camera);
}
tick();
