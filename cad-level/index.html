<div id="hud">

<script>
"use strict";
const scene=new THREE.Scene();

scene.fog=new THREE.FogExp2(0xcbdcea,.0017);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.2,4000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:1,far:900});

const palette={
  "SCRIM 6' FENCE":0x17191d,"SCRIM 8' FENCE":0x111318,"Fence Line":0x24272b,"Bike Rack":0x25a842,
  "Stages":0x272833,"Tents":0xf1eadb,"Stretch Tents":0xe9dfc4,"Food":0xf0a34a,"Vendors":0xdb4f93,
  "Porta Potties _ Bathroom Trucks":0x3f8ecb,"Parking":0x4a4a50,"Park Infrastructure":0xb7b1a2,
  "Fire Exits":0xe04c44,"Emergency Exits":0xe04c44,"Traffic":0xe8d059,"Sponsor Activations":0x6a61c7,"Preparty":0x42a89e
};
const roots=new Map();
function rootFor(layer){
  if(!roots.has(layer)){const g=new THREE.Group();g.name=layer;roots.set(layer,g);scene.add(g)}
  return roots.get(layer);
}
function material(layer){return new THREE.MeshStandardMaterial({color:palette[layer]||0x6e7886,roughness:.78,metalness:layer.includes("Fence")?.32:0})}
function segment(a,b,height,width,mat,parent){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz); if(len<.03)return;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(width,height,len),mat);
  mesh.position.set((a[0]+b[0])/2,height/2,(a[1]+b[1])/2);mesh.rotation.y=Math.atan2(dx,dz);
  mesh.castShadow=mesh.receiveShadow=true;parent.add(mesh);
}
function shapeMesh(path,layer,parent){
  const pts=path.points;if(pts.length<3)return false;
  const shape=new THREE.Shape();shape.moveTo(pts[0][0],-pts[0][1]);for(let i=1;i<pts.length;i++)shape.lineTo(pts[i][0],-pts[i][1]);
  const heights={"Stages":2.2,"Tents":.22,"Stretch Tents":.18,"Food":2.4,"Vendors":2.25,"Porta Potties _ Bathroom Trucks":2.6,"Parking":.04,"Park Infrastructure":.4,"Sponsor Activations":1.2,"Preparty":.25};
  const geo=new THREE.ExtrudeGeometry(shape,{depth:heights[layer]||.12,bevelEnabled:false});
  geo.rotateX(-Math.PI/2);

}
function makeLabel(text,x,z){
  const cv=document.createElement("canvas"),c=cv.getContext("2d");c.font="700 28px Segoe UI";const w=Math.ceil(c.measureText(text).width)+28;
  cv.width=w*2;cv.height=78;c.scale(2,2);c.fillStyle="#162538dc";c.fillRect(0,0,w,39);c.fillStyle="white";c.textAlign="center";c.textBaseline="middle";c.font="700 14px Segoe UI";c.fillText(text,w/2,20);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(Math.min(26,w/8),3.8,1);s.position.set(x,5,z);s.renderOrder=20;rootFor("Labels").add(s);
}
function isUsefulLabel(t){return /STAGE|LIMITLESS|VIP|GATE|BAR|FOOD|VENDOR|RESTROOM|BATHROOM|SOLAR|ENTRANCE|PARKING|LOUNGE|TENT|ADA|PRODUCTION|HOSPITAL|CAMP|COCONUT|INNERBASS|BUTWOOD|CREATION|REVIVAL/i.test(t)}

// Detailed assets reuse the proportions, colors, truss language, shade
// structures and signage from the original SSBD level. Their anchors stay CAD.
const detail=rootFor("Detailed assets");
const M={
  dark:new THREE.MeshStandardMaterial({color:0x252631,roughness:.84}),
  truss:new THREE.MeshStandardMaterial({color:0x7a8390,roughness:.45,metalness:.62}),
  gold:new THREE.MeshStandardMaterial({color:0xd9b24a,roughness:.42,metalness:.48}),
  canvas:new THREE.MeshStandardMaterial({color:0xf1eadb,roughness:.88,side:THREE.DoubleSide}),
  wood:new THREE.MeshStandardMaterial({color:0x8b6844,roughness:.92}),
  pink:new THREE.MeshStandardMaterial({color:0xd9358f,roughness:.58,emissive:0x52112f,emissiveIntensity:.24}),
  blue:new THREE.MeshStandardMaterial({color:0x3f8ecb,roughness:.75})
};
function addBox(g,w,h,d,x,y,z,mat=M.dark){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;g.add(m);return m}
function addPost(g,x,z,h=4,mat=M.truss){return addBox(g,.18,h,.18,x,h/2,z,mat)}
function peakedTent(x,z,w,d,rot,color=0xf1eadb){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const mat=color===0xf1eadb?M.canvas:new THREE.MeshStandardMaterial({color,roughness:.86,side:THREE.DoubleSide});
  const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute([
    -w/2,3,-d/2,w/2,3,-d/2,w/2,5,0,-w/2,3,-d/2,w/2,5,0,-w/2,5,0,
    -w/2,5,0,w/2,5,0,w/2,3,d/2,-w/2,5,0,w/2,3,d/2,-w/2,3,d/2
  ],3));geo.computeVertexNormals();const roof=new THREE.Mesh(geo,mat);roof.castShadow=true;g.add(roof);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3,M.truss);
  return g;
}
function festivalStage(x,z,rot,w=24,d=13,butwood=false){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,1,d,0,.5,0,butwood?M.wood:M.dark);addBox(g,w,1.2,1,0,9,d/2-.5,butwood?M.wood:M.pink);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,9);
  addBox(g,w+.4,.24,.24,0,8.8,-d/2,M.truss);addBox(g,w+.4,.24,.24,0,8.8,d/2,M.truss);
  for(let i=-2;i<=2;i++){const lamp=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),new THREE.MeshStandardMaterial({color:0x26262e,emissive:i%2?0x20c8d8:0xd9358f,emissiveIntensity:2}));lamp.position.set(i*w/6,7.8,d/2+.2);g.add(lamp)}
  return g;
}
function rod(g,x1,y1,x2,y2,z,thick,mat){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),m=addBox(g,len,thick,thick,(x1+x2)/2,(y1+y2)/2,z,mat);
  m.rotation.z=Math.atan2(dy,dx);return m;
}
// Same Stage is deliberately its own model. The reference is a broad open
// scaffold wall, not the generic roofed festivalStage() box used in pass one.
function sameStageAsset(){
  // Exact oriented footprint of DXF Stages/Group-70. The previous pass wrongly
  // treated its axis-aligned bounding box as width/depth. Undoing the block's
  // 38.980048° rotation gives 998.7438 x 410.7484 CAD units.
  const w=26.8163,d=11.0286,h=15.9110;
  const g=new THREE.Group();g.name="THE SAME STAGE · CAD";
  g.position.set(24.2618,0,26.5208);g.rotation.y=.86849;detail.add(g);
  const orange=new THREE.MeshStandardMaterial({color:0xd58a27,roughness:.58,metalness:.34});
  const ivory=new THREE.MeshStandardMaterial({color:0xe8e4dc,roughness:.82});
  const black=new THREE.MeshStandardMaterial({color:0x101116,roughness:.7,metalness:.18});
  const screen=new THREE.MeshStandardMaterial({color:0x17131f,emissive:0x25103f,emissiveIntensity:.55,roughness:.5});

  addBox(g,w,1.15,d,0,.58,0,black);
  addBox(g,w*.46,h*.41,.45,0,h*.28,d*.30,screen);

  // Curved scaffold wall: 17 bays, higher end towers and the same shallow bow
  // visible in Peter's reference image.
  const wallZ=x=>d*.34-.018*x*x, wallH=x=>h*.79+Math.abs(x)*.22;
  for(let i=0;i<=16;i++){
    const bay=w/16,x=-w/2+i*bay,z=wallZ(x),wh=wallH(x);
    addBox(g,.16,wh,.16,x,wh/2,z,orange);
    for(let y=3.1;y<wh;y+=3.1)addBox(g,bay,.13,.13,x,y,z,orange);
    if(i<16&&i%2===0)rod(g,x,3.1,x+bay,6.2,z-.05,.12,orange);
    if(i<16&&i%2===1)rod(g,x,6.2,x+bay,3.1,z-.05,.12,orange);
  }

  // Patterned side towers: pale checker blocks with the black zigzag strokes
  // that define the real facade.
  for(const side of [-1,1]){
    const tx=side*w*.38;
    for(let c=0;c<4;c++)for(let r=0;r<7;r++){
      const pw=w*.063;
      const panel=addBox(g,pw,1.65,.28,tx+side*(c-1.5)*pw,2.1+r*1.68,wallZ(tx)-.35,
        (c+r)%3===0?black:ivory);
      panel.rotation.y=-side*.08;
    }
    const zx=side*w*.31;
    for(let k=0;k<6;k++){
      const y1=2.2+k*1.9,y2=y1+1.55;
      const run=w*.083;
      rod(g,zx+side*(k%2?0:run),y1,zx+side*(k%2?run:0),y2,wallZ(zx)-.7,.48,black);
    }
    // line array on the outside edge
    for(let j=0;j<8;j++)addBox(g,1.25,.56,1.05,side*(w/2-.7),h*.86-j*.63,d*.08+j*.08,black);
  }

  // Dense moving-light field across the scaffold and deck edge.
  const lampMatA=new THREE.MeshStandardMaterial({color:0x24252c,emissive:0x56d7ee,emissiveIntensity:1.8});
  const lampMatB=new THREE.MeshStandardMaterial({color:0x24252c,emissive:0xd9358f,emissiveIntensity:1.8});
  for(let i=0;i<32;i++){
    const x=-w*.43+(i%16)*(w*.86/15),y=3.0+Math.floor(i/16)*4.3+(i%3)*1.15;
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),i%2?lampMatA:lampMatB);
    lamp.position.set(x,y,wallZ(x)-.55);g.add(lamp);
  }
  for(let i=-5;i<=5;i++){
    const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.48,8),i%2?lampMatA:lampMatB);
    lamp.position.set(i*w/12,1.5,-d*.42);lamp.rotation.x=-.9;g.add(lamp);
  }
  makeLabel("THE SAME STAGE",24.2618,18.5,26.5208);
  return g;
}
function limitlessAssets(){
  const rot=-1.48;
  const deck=new THREE.Group();deck.position.set(14.5,0,42);deck.rotation.y=rot;detail.add(deck);
  const deckW=32*.3048,deckD=20*.3048;
  addBox(deck,deckW,.36,deckD,0,4,0,M.dark);
  for(const [x,z] of [[-deckW*.41,-deckD*.4],[deckW*.41,-deckD*.4],[-deckW*.41,deckD*.4],[deckW*.41,deckD*.4],[0,0]])addPost(deck,x,z,3.9);
  for(const [x,z,w,d] of [[0,-deckD/2,deckW,.12],[-deckW/2,0,.12,deckD],[0,deckD/2,deckW,.12]])addBox(deck,w,.9,d,x,4.8,z,M.gold);
  const lounge=new THREE.Group();lounge.position.set(2.9347,0,43.0595);lounge.rotation.y=rot;detail.add(lounge);
  const loungeW=40*.3048,loungeD=20*.3048;
  addBox(lounge,loungeW,.22,loungeD,0,3.55,0,M.dark);
  for(const x of [-loungeW*.45,0,loungeW*.45])for(const z of [-loungeD*.45,loungeD*.45])addPost(lounge,x,z,3.5);
  addBox(lounge,loungeW*.73,.1,loungeD*.66,0,.06,0,new THREE.MeshStandardMaterial({color:0x322545,roughness:1}));
  addBox(lounge,loungeW*.32,1.1,.9,0,.55,loungeD*.35,M.gold);
  const solar=new THREE.Group();solar.position.set(-7.2303,0,45.9181);solar.rotation.y=rot;detail.add(solar);
  for(let i=-1;i<=1;i++){const u=new THREE.Group();u.position.x=i*3.3;solar.add(u);addBox(u,2.55,2.9,2.35,0,1.45,0,M.blue);const pv=addBox(u,2.65,.09,2.15,0,3.12,0,new THREE.MeshStandardMaterial({color:0x17243b,roughness:.25,metalness:.5}));pv.rotation.x=-.15}
}
function barAsset(x,z,rot,w,d){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,1.15,d,0,.58,0,M.wood);addBox(g,w+.12,.2,d+.12,0,1.22,0,M.gold);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3.2);
  addBox(g,w+.25,.18,.2,0,3.15,-d/2,M.pink);return g;
}
function stallAsset(x,z,rot,w,d,food){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g),col=food?0xf0a34a:0xdb4f93;
  addBox(g,w,2.5,d,0,1.25,0,new THREE.MeshStandardMaterial({color:col,roughness:.8}));
  addBox(g,w+.18,.22,d+.18,0,2.68,0,M.canvas);addBox(g,w*.66,.9,.18,0,1.6,-d/2-.02,M.dark);
}
function entranceAsset(x,z,rot,name){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  for(const px of [-5.5,5.5]){addBox(g,1.1,8,1.1,px,4,0,M.truss);addBox(g,1.45,.42,1.45,px,8.25,0,M.gold)}
  addBox(g,12.1,.75,.75,0,7.6,0,M.truss);addBox(g,9.5,1.25,.34,0,6.9,-.4,M.pink);
  for(let i=-2;i<=2;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),new THREE.MeshStandardMaterial({color:0x302b35,emissive:i%2?0x29d3c6:0xffd166,emissiveIntensity:2}));l.position.set(i*1.8,7.55,.5);g.add(l)}
  makeLabel(name,x,9.8,z);
}
function restroomAsset(x,z,rot,count=3){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  for(let i=0;i<count;i++){const u=new THREE.Group();u.position.x=(i-(count-1)/2)*2.35;g.add(u);addBox(u,2,2.7,2,0,1.35,0,M.blue);addBox(u,2.2,.16,2.2,0,2.78,0,M.dark);addBox(u,.85,1.95,.08,0,1.08,-1.02,new THREE.MeshStandardMaterial({color:0x286a99,roughness:.85}))}

function fohAsset(x,z,rot,w,d){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,.22,d,0,.12,0,M.dark);for(const px of [-w*.45,w*.45])for(const pz of [-d*.45,d*.45])addPost(g,px,pz,3.1);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.6,4),M.canvas);roof.position.y=3.8;roof.rotation.y=Math.PI/4;g.add(roof);
  addBox(g,w*.62,1.2,d*.27,0,.65,0,M.dark);
}
function adaDeck(x,z,rot,w,d){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,.25,d,0,.18,0,M.dark);
  for(const [px,pz,rw,rd] of [[0,-d/2,w,.08],[-w/2,0,.08,d],[w/2,0,.08,d]])addBox(g,rw,1,rd,px,.65,pz,M.gold);
}
function pathFootprint(path){
  const pts=path.points.slice(0,-1);if(pts.length<3)return null;
  const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length,cz=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  let edge=[1,0],longest=0;
  for(let i=0;i<pts.length;i++){const q=pts[(i+1)%pts.length],dx=q[0]-pts[i][0],dz=q[1]-pts[i][1],len=Math.hypot(dx,dz);if(len>longest){longest=len;edge=[dx/len,dz/len]}}
  const side=[-edge[1],edge[0]],us=pts.map(p=>p[0]*edge[0]+p[1]*edge[1]),vs=pts.map(p=>p[0]*side[0]+p[1]*side[1]);
  return {x:cx,z:cz,w:Math.max(...us)-Math.min(...us),d:Math.max(...vs)-Math.min(...vs),rot:Math.atan2(-edge[1],edge[0])};
}
function exactFootprint(data,anchor,layer){
  let best=null,bestDist=Infinity;
  for(const path of data.paths){
    if(path.layer!==layer||!path.closed||path.points.length<4)continue;
    const fp=pathFootprint(path);if(!fp)continue;
    const dist=Math.hypot(fp.x-anchor.point[0],fp.z-anchor.point[1]);if(dist>=bestDist)continue;
    bestDist=dist;best=fp;
  }
  return bestDist<12?best:null;
}
function buildDetailedAssets(data){
  sameStageAsset();
  // CAD calls But a 40x20 stage: 12.192m x 6.096m, not the oversized 20x11m
  // placeholder from the first visual pass.
  festivalStage(-38.17,147.1,.18,12.192,6.096,true);
  limitlessAssets();
  peakedTent(20.1567,76.5835,50*.3048,30*.3048,-.33);
  peakedTent(.9549,112.7312,40*.3048,40*.3048,.1,0xd8c7ef);
  barAsset(36.8317,92.5351,-.25,30*.3048,20*.3048);
  barAsset(57.1547,30.8776,-.1,40*.3048,10*.3048);
  entranceAsset(134.2,-64.54,.55,"EAST ENTRANCE");entranceAsset(-49.79,227.81,-.7,"WEST ENTRANCE");
  fohAsset(62.45,62.1,.05,20*.3048,20*.3048);
  adaDeck(55.6751,68.4,.05,12*.3048,8*.3048);
  const placed=[];for(const a of data.anchors){const food=/^FOOD(?: TRUCK)?$/i.test(a.text),vendor=/^VENDORS?$/i.test(a.text);if(!food&&!vendor)continue;
    const fp=exactFootprint(data,a,food?"Food":"Vendors");if(!fp||placed.some(p=>Math.hypot(p[0]-fp.x,p[1]-fp.z)<2))continue;
    placed.push([fp.x,fp.z]);stallAsset(fp.x,fp.z,fp.rot,fp.w,fp.d,food)}
  // Every remaining tent uses its closed DXF outline. Skip the two named tents
  // above so they are not drawn twice.
  for(const path of data.paths){
    if(!path.closed||!(path.layer==="Tents"||path.layer==="Stretch Tents"))continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1.5||fp.d<1.5||fp.w>45||fp.d>45)continue;
    if(Math.hypot(fp.x-20.1567,fp.z-76.5835)<8||Math.hypot(fp.x-.9549,fp.z-112.7312)<8)continue;
    peakedTent(fp.x,fp.z,fp.w,fp.d,fp.rot,path.layer==="Stretch Tents"?0xe9dfc4:0xf1eadb);
  }
}

fetch("site-plan.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
  for(const path of data.paths){
    const layer=path.layer,parent=rootFor(layer),fence=/FENCE|Bike Rack/.test(layer);
    if(path.closed&&!fence&&shapeMesh(path,layer,parent))continue;
    const h=layer==="SCRIM 8' FENCE"?2.45:layer==="Bike Rack"?1.05:fence?1.85:.18;
    const w=layer==="Bike Rack"?.08:fence?.11:.16,mat=material(layer);
    for(let i=1;i<path.points.length;i++)segment(path.points[i-1],path.points[i],h,w,mat,parent);
  }
  const seen=[];for(const a of data.anchors){if(!isUsefulLabel(a.text))continue;if(seen.some(p=>Math.hypot(p[0]-a.point[0],p[1]-a.point[1])<2))continue;seen.push(a.point);makeLabel(a.text,a.point[0],a.point[1])}
  buildDetailedAssets(data);
  buildLayerPanel();
  document.querySelector("#status").textContent=`${data.stats.entities} DXF entities · ${data.stats.paths} paths · ${data.stats.anchors} labels`;
  festivalView();
}).catch(e=>document.querySelector("#status").textContent="CAD load failed: "+e.message);

function buildLayerPanel(){
  const box=document.querySelector("#layers");
  [...roots.keys()].sort().forEach(layer=>{const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=true;
    input.onchange=()=>roots.get(layer).visible=input.checked;label.append(input,document.createTextNode(layer));box.append(label)});
}

let yaw=0,pitch=-.32;const keys={};
// Viewpoint requested by Peter: standing at Limitless and looking into the
// festival. Solar is behind; Butwood is right; food and East Entrance are left.
function festivalView(){camera.position.set(2.9,14,43.1);yaw=-1.30;pitch=-.24}
function overview(){camera.position.set(30,430,35);yaw=0;pitch=-Math.PI/2+.001}
document.querySelector("#overview").onclick=overview;document.querySelector("#spawn").onclick=festivalView;
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),dir=new THREE.Vector3(),right=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04),turn=1.25*dt;
  if(keys.ArrowLeft)yaw+=turn;if(keys.ArrowRight)yaw-=turn;if(keys.ArrowUp)pitch+=turn;if(keys.ArrowDown)pitch-=turn;
  pitch=THREE.MathUtils.clamp(pitch,-1.56,1.25);camera.rotation.order="YXZ";camera.rotation.set(pitch,yaw,0);
  camera.getWorldDirection(dir);right.crossVectors(dir,camera.up).normalize();const speed=(keys.ShiftLeft||keys.ShiftRight?95:30)*dt;
  if(keys.KeyW)camera.position.addScaledVector(dir,speed);if(keys.KeyS)camera.position.addScaledVector(dir,-speed);
  if(keys.KeyA)camera.position.addScaledVector(right,-speed);if(keys.KeyD)camera.position.addScaledVector(right,speed);
  if(keys.KeyE)camera.position.y+=speed;if(keys.KeyQ)camera.position.y-=speed;
  renderer.render(scene,camera);
}
tick();
</script>
