<body>

<script>
"use strict";
// A blank canvas is never an acceptable failure mode. Surface any browser
// runtime error in the HUD so a bad asset/API cannot silently look like sky.
window.addEventListener('error',event=>{
  const status=document.querySelector('#status');
  if(status)status.textContent=`Runtime error: ${event.message}`;
});
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c6ee);
scene.fog=new THREE.FogExp2(0xb9cde0,.00105);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.2,4000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.82; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfd9f1,0x596238,.82));
const sun=new THREE.DirectionalLight(0xffedcb,1.55); sun.position.set(180,300,140); sun.castShadow=true; scene.add(sun);
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:1,far:900});

// This is an actual world, not a CAD sheet sitting on two discs: a broad,
// irregular Lake Perris basin with low surrounding foothills, shoreline and a
// horizon-grade sky.  The surveyed festival pads remain flat and authoritative.
// Keep the lake visibly above the lawn/sand surface.  It is drawn after the
// ground and therefore cleanly masks the old full-lawn disc inside the lake
// footprint; placing it below that disc was why Lake Perris appeared missing.
const WATER_LEVEL=.085;
// The lake lies southeast of the festival core in this mirrored CAD/world
// coordinate space. These constants drive the water, shore and terrain cutout
// together so the surface cannot float through a hillside.
// The PDF shows Lake Perris as the dominant south/east horizon, not a small
// decorative pond behind Coconut Cove.  This enlarged basin keeps the same
// surveyed Coconut Cove tangent while carrying the lake through the bottom of
// the playable world.
const LAKE_X=901.3,LAKE_Z=873.9;
// The waterline is tangent to the lake-facing corner of the CAD's Coconut
// Cove 130' stretch tent ([214.2843,174.8828]). Do not leave an invented
// strip of beach between that tent and Lake Perris.
const LAKE_RADIUS=980;
const terrainGeo=new THREE.PlaneGeometry(2300,2300,160,160);
const terrainPos=terrainGeo.attributes.position;
for(let i=0;i<terrainPos.count;i++){
  const x=terrainPos.getX(i),z=terrainPos.getY(i),r=Math.hypot(x,z);
  const basin=Math.max(0,(r-270)/650);
  const ridge=basin*basin*(18+10*Math.sin(x*.008)+7*Math.cos(z*.011)+5*Math.sin((x+z)*.015));
  const detail=basin*(2.8*Math.sin(x*.035)*Math.cos(z*.028)+1.3*Math.sin((x-z)*.07));
  const landY=Math.max(WATER_LEVEL-.05,ridge+detail-.2);
  const lakeDistance=Math.hypot(x-LAKE_X,z-LAKE_Z);
  // Excavate a shallow lakebed wherever the real water footprint lies.  This
  // fixes the old condition where a flat water disc crossed raised terrain.
  terrainPos.setZ(i,lakeDistance<LAKE_RADIUS+9?Math.min(landY,WATER_LEVEL-.075):landY);
}
terrainGeo.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({color:0x9c875d,roughness:1}));
terrain.rotation.x=-Math.PI/2;terrain.receiveShadow=true;scene.add(terrain);
const grass=new THREE.Mesh(new THREE.CircleGeometry(330,128),new THREE.MeshStandardMaterial({color:0x587f42,roughness:.98}));
grass.rotation.x=-Math.PI/2;grass.position.y=.035;grass.receiveShadow=true;scene.add(grass);
// This is the full-resolution Vectorworks satellite underlay, registered from
// the DXF IMAGE insertion transform—not stretched or eyeballed.  It is the
// source of truth for the real Lake Perris shoreline, beach, roads and every
// existing tree location.  Keep the old procedural world beneath it only as a
// fallback; it must not replace the surveyed aerial context.
const aerialCorners=[[-2549.9626,1767.6678],[1861.7716,939.9352],[1379.957,-1628.0892],[-3031.7772,-800.3565]];
const aerialGeo=new THREE.BufferGeometry();
aerialGeo.setAttribute('position',new THREE.Float32BufferAttribute(aerialCorners.flatMap(([x,z])=>[x,.062,z]),3));

aerialGeo.setIndex([0,1,2,0,2,3]);aerialGeo.computeVertexNormals();
// Do not decode the full aerial as a WebGL texture in this lightweight viewer:
// Safari can lose the entire WebGL context on large photo textures. The image
// is served in the separate Site aerial reference view instead.
const aerial=new THREE.Mesh(aerialGeo,new THREE.MeshBasicMaterial({visible:false}));
aerial.name='VECTORWORKS GEOREGISTERED SATELLITE AERIAL';aerial.receiveShadow=true;scene.add(aerial);
// Kept out of the WebGL scene while the browser-level renderer uses its

// exposed through the Site aerial view rather than crashing the live world.
aerial.visible=false;
terrain.visible=false;grass.visible=false;
const shore=new THREE.Mesh(new THREE.RingGeometry(LAKE_RADIUS,LAKE_RADIUS+3.2,160),new THREE.MeshStandardMaterial({color:0xcdbb83,roughness:1,side:THREE.DoubleSide}));
shore.rotation.x=-Math.PI/2;shore.position.set(LAKE_X,WATER_LEVEL+.012,LAKE_Z);shore.receiveShadow=true;scene.add(shore);
shore.visible=false;
const skyGeo=new THREE.SphereGeometry(1900,48,24);
const sky=new THREE.Mesh(skyGeo,new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color(0x2872b2)},bottom:{value:new THREE.Color(0xd9e9ee)}},vertexShader:'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform vec3 top;uniform vec3 bottom;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*.5+.5,0.,1.);gl_FragColor=vec4(mix(bottom,top,smoothstep(.04,.92,h)),1.);}'}));
scene.add(sky);
const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.32,depthWrite:false});
for(let i=0;i<34;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(12+(i%4)*7,12,8),cloudMat);const a=i*2.399;c.position.set(Math.cos(a)*(410+i%6*75),80+(i%5)*13,Math.sin(a)*(410+i%6*75));c.scale.z=.32;scene.add(c)}
// Native Lake Perris vegetation follows the aerial-plan bands: road/parking
// edge, west campground, and the north/east shore.  Do not use a decorative
// radial scatter around the festival core; that invents trees where the PDF
// shows open lawn, stages, and beach.
const treeTrunkGeo=new THREE.CylinderGeometry(.22,.34,3.8,6),treeCrownGeo=new THREE.ConeGeometry(2.2,6.4,8);
const treeTrunkMat=new THREE.MeshStandardMaterial({color:0x62462d,roughness:1}),treeCrownMat=new THREE.MeshStandardMaterial({color:0x395b32,roughness:.95});
const trees=new THREE.Group();trees.name="LAKE PERRIS TREES";scene.add(trees);
const treeBands=[
  [[-255,-130],[-215,-116],[-176,-104],[-136,-91],[-96,-78],[-58,-66]], // west road / campground edge
  [[-118,112],[-89,132],[-58,151],[-24,166],[10,177],[44,184]],          // west/south festival edge
  [[-82,-146],[-42,-151],[-1,-148],[39,-141],[79,-128],[118,-112]],     // production / north road edge
  [[238,-104],[270,-87],[298,-64],[321,-34],[339,-1]],                    // east park edge
  [[274,38],[292,64],[310,92],[326,121],[338,151]],                       // east shore tree band
  [[84,202],[111,211],[139,216],[166,217]]                                // beach approach, kept west of Coco Cove
];
let treeIndex=0;
for(const band of treeBands)for(const [bx,bz] of band)for(let j=0;j<4;j++){
  const a=treeIndex*2.3999632297,jitterX=Math.cos(a)*3.6,jitterZ=Math.sin(a)*3.6;
  const h=.74+(treeIndex%7)*.07,g=new THREE.Group();g.position.set(bx+jitterX,0,bz+jitterZ);g.rotation.y=a*.37;g.scale.setScalar(h);
  const trunk=new THREE.Mesh(treeTrunkGeo,treeTrunkMat),crown=new THREE.Mesh(treeCrownGeo,treeCrownMat);trunk.position.y=1.9;crown.position.y=6.1;trunk.castShadow=crown.castShadow=true;trees.add(g);g.add(trunk,crown);
  treeIndex++;
}
// The satellite layer already carries the real tree map. Hide the previous
// hand-placed proxy forest until individual 3D trees are sampled from it.
trees.visible=false;
// Preserve the satellite's exact water shape/colour; this is only a light
// reflective sheen above it, not a replacement blue disc.
const lake=new THREE.Mesh(new THREE.CircleGeometry(LAKE_RADIUS,160),new THREE.MeshPhysicalMaterial({color:0x1d7898,roughness:.13,metalness:.08,transparent:true,opacity:.38,clearcoat:.35}));
lake.rotation.x=-Math.PI/2; lake.position.set(LAKE_X,WATER_LEVEL,LAKE_Z); lake.receiveShadow=true;scene.add(lake);
// The aerial carries the real water polygon.  A circular proxy, even faint,
// would corrupt the true shoreline visible in the Vectorworks source.
lake.visible=false;

// The TIFF is the site authority.  We cannot safely upload its 326 MB source
// texture to this r128/Safari renderer, so these are deliberately modest,
// aerial-traced material zones rather than a fake circular lawn.  They make
// the playable world read like the actual park: maintained grass at the event
// core, decomposed-granite roads/parking, concrete pads, and the broad sandy
// beach that meets Coconut Cove and the ADA approach.
const siteSurface=new THREE.Group();siteSurface.name="AERIAL-TRACED SITE SURFACES";scene.add(siteSurface);
function sitePatch(name,points,color,y=.018){
  const shape=new THREE.Shape();shape.moveTo(points[0][0],-points[0][1]);
  for(let i=1;i<points.length;i++)shape.lineTo(points[i][0],-points[i][1]);
  const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshStandardMaterial({color,roughness:.96}));
  mesh.name=name;mesh.rotation.x=-Math.PI/2;mesh.position.y=y;mesh.receiveShadow=true;siteSurface.add(mesh);return mesh;
}
function siteRibbon(name,points,width,color,y=.025){
  const left=[],right=[];for(let i=0;i<points.length;i++){
    const a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)],dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz)||1;
    left.push([points[i][0]-dz/l*width/2,points[i][1]+dx/l*width/2]);right.unshift([points[i][0]+dz/l*width/2,points[i][1]-dx/l*width/2]);
  } return sitePatch(name,left.concat(right),color,y);
}
sitePatch("AERIAL LAWN",[[-220,-150],[80,-165],[235,-92],[282,20],[252,132],[202,184],[118,224],[4,262],[-124,238],[-214,148],[-250,24]],0x6f8751,.006);
sitePatch("AERIAL BEACH SAND",[[-163,145],[-104,190],[-25,238],[48,274],[121,264],[177,229],[214,187],[201,161],[161,177],[104,205],[32,219],[-53,191]],0xd8c28b,.031);
sitePatch("COCONUT COVE SAND APRON",[[156,151],[205,148],[231,177],[217,204],[180,216],[153,192]],0xe0ca94,.036);
siteRibbon("AERIAL PARK ACCESS ROAD",[[-246,-92],[-173,-69],[-103,-46],[-29,-25],[38,0],[97,25],[149,54],[194,87],[236,120]],12,0x857e70,.021);
siteRibbon("AERIAL BEACH ADA APPROACH",[[46,254],[68,236],[97,216],[126,196],[159,179],[192,162]],7.8,0xb3afa3,.041);
sitePatch("AERIAL CONCRETE PLAZA",[[61,-22],[126,-14],[141,39],[94,55],[52,24]],0xa9a79f,.034);
sitePatch("AERIAL EAST LOT",[[86,50],[183,72],[212,119],[147,133],[92,104]],0x98958b,.028);
// Restore visible park vegetation only in aerial-confirmed edge bands.  The
// core remains open grass; scattered decoration there would contradict the
// source image and the festival plan.
trees.visible=true;

const palette={
  "SCRIM 6' FENCE":0x17191d,"SCRIM 8' FENCE":0x111318,"Fence Line":0x17191d,"Bike Rack":0x25a842,
  "Stages":0x272833,"Tents":0xf1eadb,"Stretch Tents":0xe9dfc4,"Food":0xf0a34a,"Vendors":0xdb4f93,
  "Porta Potties _ Bathroom Trucks":0x3f8ecb,"Parking":0x4a4a50,"Park Infrastructure":0xb7b1a2,
  "Fire Exits":0xe04c44,"Emergency Exits":0xe04c44,"Traffic":0xe8d059,"Sponsor Activations":0x6a61c7,"Preparty":0x42a89e
  ,"Camp Lanes":0xe7d067,"Trash":0x48555d,"Event-Worklight":0xe8d059,"Power-Parts-Supply":0xe7e1d6
};
const roots=new Map();
function rootFor(layer){
  if(!roots.has(layer)){const g=new THREE.Group();g.name=layer;roots.set(layer,g);scene.add(g)}
  return roots.get(layer);
}
// CAD geometry stays on and inspectable, but it is an alignment overlay—not a
// second opaque city rendered on top of the authored festival assets.
function material(layer){
  const fence=/FENCE|Bike Rack/.test(layer);
  return new THREE.MeshStandardMaterial({
    color:palette[layer]||0x6e7886,roughness:.78,metalness:fence?.32:0,
    transparent:!fence,opacity:fence?1:.18,depthWrite:fence
  });
}
function segment(a,b,height,width,mat,parent){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz); if(len<.03)return;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(width,height,len),mat);
  mesh.position.set((a[0]+b[0])/2,height/2,(a[1]+b[1])/2);mesh.rotation.y=Math.atan2(dx,dz);
  mesh.castShadow=mesh.receiveShadow=true;parent.add(mesh);
}
function physicalFenceSegment(a,b,height,width,mat,parent,layer){
  // Keep the surveyed polyline itself authoritative, but turn it into a fence
  // a person can actually read at ground level: spaced posts, two rails and a
  // continuous scrim/mesh panel.  The previous single skinny box was a CAD
  // stroke wearing a fence costume.
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);if(len<.03)return;
  const g=new THREE.Group();g.position.set((a[0]+b[0])/2,0,(a[1]+b[1])/2);g.rotation.y=Math.atan2(dx,dz);parent.add(g);
  // Perimeter fence is black scrim, including the CAD's legacy red Fence Line
  // drafting layer.  Red was a plan annotation colour, not the installed fence.
  const postMat=M.truss;
  const meshMat=new THREE.MeshStandardMaterial({color:0x181b20,roughness:.96,transparent:true,opacity:.9,side:THREE.DoubleSide});
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(.01,len-width),Math.max(.1,height-.30)),meshMat);
  panel.position.y=height*.51;panel.rotation.y=Math.PI/2;panel.castShadow=true;g.add(panel);
  addBox(g,.11,.11,len,0,height-.13,0,postMat);addBox(g,.09,.09,len,0,.24,0,postMat);
  const posts=Math.max(1,Math.ceil(len/2.45));
  for(let i=0;i<=posts;i++)addBox(g,.18,height+.14,.18,0,(height+.14)/2,-len/2+i*len/posts,postMat);
}
function eastBeachFenceToWater(){
  // The source has this perimeter as short adjoining SCRIM entities, which
  // made it read as a few unrelated fence stubs in the world.  These are the
  // surveyed endpoints in their beach order: festival boundary, ADA/beach
  // edge, then the lake endpoint.  Render the continuous installed run while
  // preserving the separately-mapped gate openings.
  const points=[
    [16.1872,149.1802],[31.0312,165.1317],[33.9360,167.6126],
    [41.9062,159.3717],[75.4485,160.6944],[116.7210,176.7808],
    [132.3400,193.0500],[148.1700,209.6000],[164.0034,226.1616]
  ];
  const mat=new THREE.MeshStandardMaterial({color:0x181b20,roughness:.96});
  for(let i=1;i<points.length;i++)physicalFenceSegment(points[i-1],points[i],2.45,.13,mat,detail,"SCRIM 8' FENCE");
}
function shapeMesh(path,layer,parent){
  const pts=path.points;if(pts.length<3)return false;
  const shape=new THREE.Shape();shape.moveTo(pts[0][0],-pts[0][1]);for(let i=1;i<pts.length;i++)shape.lineTo(pts[i][0],-pts[i][1]);
  const heights={"Stages":2.2,"Tents":.22,"Stretch Tents":.18,"Food":2.4,"Vendors":2.25,"Porta Potties _ Bathroom Trucks":2.6,"Parking":.04,"Park Infrastructure":.4,"Sponsor Activations":1.2,"Preparty":.25};
  const geo=new THREE.ExtrudeGeometry(shape,{depth:heights[layer]||.12,bevelEnabled:false});
  geo.rotateX(-Math.PI/2);
  const mesh=new THREE.Mesh(geo,material(layer));mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return true;
}
function makeLabel(text,x,z){
  const cv=document.createElement("canvas"),c=cv.getContext("2d");c.font="700 28px Segoe UI";const w=Math.ceil(c.measureText(text).width)+28;
  cv.width=w*2;cv.height=78;c.scale(2,2);c.fillStyle="#162538dc";c.fillRect(0,0,w,39);c.fillStyle="white";c.textAlign="center";c.textBaseline="middle";c.font="700 14px Segoe UI";c.fillText(text,w/2,20);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  // Labels are survey aids, not billboards. The old 13m-wide cap obscured
  // whole structures from the Limitless spawn and made visual verification
  // impossible at ground level.
  s.scale.set(Math.min(3.9,w/46),.59,1);s.position.set(x,3.65,z);s.renderOrder=20;
  s.material.opacity=.66;rootFor("Labels").add(s);
}
function isUsefulLabel(t){return /STAGE|LIMITLESS|VIP|GATE|BAR|FOOD|VENDOR|RESTROOM|BATHROOM|SOLAR|ENTRANCE|PARKING|LOUNGE|TENT|ADA|PRODUCTION|HOSPITAL|CAMP|COCONUT|INNERBASS|BUTWOOD|CREATION|REVIVAL|GARDEN|PORTAL|ARTIST|FLOWER|GALLERY|DINER|STORE|COFFEE|GRIFFITH|MUSEUM|FASHION|PHONE|BALLOON|ISLAND|FERRY|PONTOON/i.test(t)}

// Detailed assets reuse the proportions, colors, truss language, shade
// structures and signage from the original SSBD level. Their anchors stay CAD.
const detail=rootFor("Detailed assets");
const M={
  dark:new THREE.MeshStandardMaterial({color:0x252631,roughness:.84}),
  truss:new THREE.MeshStandardMaterial({color:0x7a8390,roughness:.45,metalness:.62}),
  gold:new THREE.MeshStandardMaterial({color:0xd9b24a,roughness:.42,metalness:.48}),
  canvas:new THREE.MeshStandardMaterial({color:0xf1eadb,roughness:.88,side:THREE.DoubleSide}),
  wood:new THREE.MeshStandardMaterial({color:0x8b6844,roughness:.92}),
  pink:new THREE.MeshStandardMaterial({color:0xd9358f,roughness:.58,emissive:0x52112f,emissiveIntensity:.24}),
  blue:new THREE.MeshStandardMaterial({color:0x3f8ecb,roughness:.75})
};
function addBox(g,w,h,d,x,y,z,mat=M.dark){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;g.add(m);return m}
function addPost(g,x,z,h=4,mat=M.truss){return addBox(g,.18,h,.18,x,h/2,z,mat)}
function hippedRoof(g,w,d,eave,peak,mat){
  // Rectangular canopy with a ridge along its long axis.  Shared by public
  // tents and FOH so neither can regress to a diamond-shaped scaled cone.
  const hw=w/2,hd=d/2,ridgeHalf=Math.max(w,d)*.18,longX=w>=d;
  const ridge=longX?[[-ridgeHalf,peak,0],[ridgeHalf,peak,0]]:[[0,peak,-ridgeHalf],[0,peak,ridgeHalf]];
  const corners=[[-hw,eave,-hd],[hw,eave,-hd],[hw,eave,hd],[-hw,eave,hd]];
  const verts=[...corners,...ridge].flat();

                        :[0,1,4,1,2,5,1,5,4,2,3,5,3,0,4,3,4,5];
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(faces);geo.computeVertexNormals();
  const roof=new THREE.Mesh(geo,mat);roof.castShadow=roof.receiveShadow=true;g.add(roof);return roof;
}
function peakedTent(x,z,w,d,rot,color=0xf1eadb){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const mat=color===0xf1eadb?M.canvas:new THREE.MeshStandardMaterial({color,roughness:.86,side:THREE.DoubleSide});

  // four-sided cone turns every non-square tent into a diamond/pyramid when
  // viewed from above -- the exact broken roof visible on the VIP and merch
  // tents.  This hipped mesh keeps every eave on the CAD rectangle and uses a

function pathFootprint(path){

  // must not distort the physical footprint.
  const sorted=raw.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);

  const pts=lower.slice(0,-1).concat(upper.slice(0,-1));if(pts.length<3)return null;
  // Rotating-calipers equivalent: every minimum-area rectangle has one side
  // parallel to a convex-hull edge, so test each edge basis exactly.
  let best=null;

    const q=pts[(i+1)%pts.length],dx=q[0]-pts[i][0],dz=q[1]-pts[i][1],len=Math.hypot(dx,dz);if(len<.0001)continue;
    const ux=dx/len,uz=dz/len,vx=-uz,vz=ux;

    if(best&&area>=best.area)continue;
    // Center is the middle of the oriented projection intervals, transformed
    // back into world coordinates. Averaging polygon vertices is wrong for
    // irregular or unevenly tessellated CAD outlines.
    const cu=(u0+u1)/2,cv=(v0+v1)/2;
    best={area,x:cu*ux+cv*vx,z:cu*uz+cv*vz,w:u1-u0,d:v1-v0,rot:Math.atan2(-uz,ux)};
  }

  if(best.d>best.w){const w=best.w;best.w=best.d;best.d=w;best.rot-=Math.PI/2}

  if(grandma)house(grandma.point[0],grandma.point[1],grandma.rotation,"GRANDMA'S HOUSE");
  if(grandpa)house(grandpa.point[0],grandpa.point[1],grandpa.rotation,"GRANDPA'S GARAGE",true);
  const creation=data.inserts.find(i=>i.name==="Block_36"&&i.layer==="Stretch Tents"&&i.bounds)?.bounds;
  creationStationAsset(creation&&{x:creation.point[0],z:creation.point[1],w:creation.width,d:creation.depth,rot:creation.rotation});
}

fetch("site-plan.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
  for(const path of data.paths){
    const layer=path.layer,parent=rootFor(layer),fence=/fence|bike rack/i.test(layer);
    if(layer==="Group Camping"||layer==="But Area"||layer==="Stage-Main"||layer==="None"||layer==="CRASH BARRICADE"||layer==="COLORMAPGOOD")continue;
    // Vendor pads receive staffed open-canopy assets below; suppress their
    // generic CAD extrusion so no opaque magenta blocks remain underneath.
    // Tents are authored below from their literal CAD footprint.  Rendering a
    // second generic extrusion here caused white tent ghosts beneath both the
    // production dumpsters and the Healers Sanctuary pavilion.
    const healerGhost=layer==="Park Infrastructure"&&path.closed&&path.points.some(p=>Math.hypot(p[0]-143.7293,p[1]-21.4455)<18);
    if(path.closed&&(layer==="Tents"||layer==="Stretch Tents"||healerGhost))continue;
    if(path.closed&&!fence&&layer!=="Vendors"&&layer!=="Tents"&&layer!=="Stretch Tents"&&!healerGhost&&shapeMesh(path,layer,parent))continue;
    const h=layer==="SCRIM 8' FENCE"?2.45:layer==="Bike Rack"?1.05:fence?1.85:.18;
    const w=layer==="Bike Rack"?.08:fence?.11:.16,mat=material(layer);
    for(let i=1;i<path.points.length;i++){
      if(fence)physicalFenceSegment(path.points[i-1],path.points[i],h,w,mat,parent,layer);
      else segment(path.points[i-1],path.points[i],h,w,mat,parent);
    }
  }
  const seen=[];for(const a of data.anchors){if(!isUsefulLabel(a.text))continue;if(seen.some(p=>Math.hypot(p[0]-a.point[0],p[1]-a.point[1])<2))continue;seen.push(a.point);makeLabel(a.text,a.point[0],a.point[1])}
  buildDetailedAssets(data);
  eastBeachFenceToWater();
  restoreLegacyDestinations(data);
  buildLayerPanel();
  document.querySelector("#status").textContent=`${data.stats.entities} DXF entities · ${data.stats.paths} paths · ${data.stats.anchors} labels`;
  festivalView();
}).catch(e=>document.querySelector("#status").textContent="CAD load failed: "+e.message);

function buildLayerPanel(){
  const box=document.querySelector("#layers");
  // The CAD level opens as a complete site, never as a selectively hidden
  // debugging view.  Detailed assets are deliberately layered over these
  // audited footprints; operators can still turn individual layers off while
  // investigating a placement, but nothing is silently absent on load.
  const hiddenByDefault=new Set();
  [...roots.keys()].sort().forEach(layer=>{const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=!hiddenByDefault.has(layer);
    roots.get(layer).visible=input.checked;
    input.onchange=()=>roots.get(layer).visible=input.checked;label.append(input,document.createTextNode(layer));box.append(label)});
}

let yaw=0,pitch=-.32;const keys={};
// Viewpoint requested by Peter: standing at Limitless and looking into the
// festival. Solar is behind; Butwood is right; food and East Entrance are left.
// Stand in the lawn rather than inside the Limitless structures: this is the
// first honest production-facing view and keeps the complete Same Stage in
// frame for every visual review.
function festivalView(){camera.position.set(-48,18,54);yaw=-1.22;pitch=-.14}
function overview(){camera.position.set(30,430,35);yaw=0;pitch=-Math.PI/2+.001}
function siteOverview(){window.open('site-aerial.html','_blank','noopener')}
document.querySelector("#overview").onclick=overview;document.querySelector("#site").onclick=siteOverview;document.querySelector("#spawn").onclick=festivalView;
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),dir=new THREE.Vector3(),right=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04),turn=1.25*dt;
  if(keys.ArrowLeft)yaw+=turn;if(keys.ArrowRight)yaw-=turn;if(keys.ArrowUp)pitch+=turn;if(keys.ArrowDown)pitch-=turn;
  pitch=THREE.MathUtils.clamp(pitch,-1.56,1.25);camera.rotation.order="YXZ";camera.rotation.set(pitch,yaw,0);
  camera.getWorldDirection(dir);right.crossVectors(dir,camera.up).normalize();const speed=(keys.ShiftLeft||keys.ShiftRight?95:30)*dt;
  if(keys.KeyW)camera.position.addScaledVector(dir,speed);if(keys.KeyS)camera.position.addScaledVector(dir,-speed);
  if(keys.KeyA)camera.position.addScaledVector(right,-speed);if(keys.KeyD)camera.position.addScaledVector(right,speed);
  if(keys.KeyE)camera.position.y+=speed;if(keys.KeyQ)camera.position.y-=speed;
  renderer.render(scene,camera);
}
tick();
</script>
