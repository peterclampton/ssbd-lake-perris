<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSBD Lake Perris — CAD Master Level</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ecfff;font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:#152238}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;left:22px;top:20px;text-transform:uppercase;letter-spacing:2px;text-shadow:0 1px #fff}
#title b{font-size:17px;letter-spacing:3px}
#title small{display:block;color:#3d5578;letter-spacing:1px}
#help{position:absolute;left:22px;bottom:20px;background:#ffffffc9;border:1px solid #18304f44;border-radius:9px;padding:8px 11px;backdrop-filter:blur(5px)}
#help kbd{font:600 11px monospace;background:#e8edf3;border:1px solid #a7b2c0;border-radius:4px;padding:1px 5px}
#panel{pointer-events:auto;position:absolute;right:20px;top:20px;width:260px;background:#f7f9fce8;border:1px solid #18304f44;border-radius:11px;padding:12px;box-shadow:0 8px 30px #18304f25;backdrop-filter:blur(8px)}
#panel h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 9px}
#panel label{display:flex;gap:8px;align-items:center;margin:5px 0}

#panel button:hover{background:#eef4fb}
#status{font-size:11px;color:#53657b;margin-top:8px}
#crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 4px #000;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="hud">
  <div id="title"><b>SSBD // Lake Perris</b><small>CAD MASTER LEVEL · DXF AUTHORITY</small></div>
  <div id="crosshair"></div>
  <div id="help"><kbd>WASD</kbd> fly · <kbd>Q/E</kbd> down/up · <kbd>arrows</kbd> look · <kbd>Shift</kbd> fast</div>
  <div id="panel">
    <h2>CAD Layers</h2>
    <div id="layers"></div>
    <button id="overview">Bird's-eye</button><button id="spawn">Festival view</button>
    <div id="status">Loading authoritative plan…</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ecfff);
scene.fog=new THREE.FogExp2(0xcbdcea,.0017);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.2,4000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc6def8,0x6c7149,1.25));
const sun=new THREE.DirectionalLight(0xfff0d2,2.4); sun.position.set(180,300,140); sun.castShadow=true; scene.add(sun);
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:1,far:900});

const grass=new THREE.Mesh(new THREE.CircleGeometry(450,96),new THREE.MeshStandardMaterial({color:0x669b50,roughness:.96}));
grass.rotation.x=-Math.PI/2; grass.receiveShadow=true; scene.add(grass);
const earth=new THREE.Mesh(new THREE.CircleGeometry(1500,96),new THREE.MeshStandardMaterial({color:0xab9667,roughness:1}));
earth.rotation.x=-Math.PI/2; earth.position.y=-.08; scene.add(earth);
// The PDF places Lake Perris southeast of the festival core. In this CAD/world
// mirrored CAD/world transform that is +X/+Z.
const lake=new THREE.Mesh(new THREE.CircleGeometry(760,128),new THREE.MeshPhysicalMaterial({color:0x277b9d,roughness:.16,metalness:.05,transparent:true,opacity:.91}));
lake.rotation.x=-Math.PI/2; lake.position.set(750,.04,720); scene.add(lake);

const palette={
  "SCRIM 6' FENCE":0x17191d,"SCRIM 8' FENCE":0x111318,"Fence Line":0x24272b,"Bike Rack":0x25a842,
  "Stages":0x272833,"Tents":0xf1eadb,"Stretch Tents":0xe9dfc4,"Food":0xf0a34a,"Vendors":0xdb4f93,
  "Porta Potties _ Bathroom Trucks":0x3f8ecb,"Parking":0x4a4a50,"Park Infrastructure":0xb7b1a2,
  "Fire Exits":0xe04c44,"Emergency Exits":0xe04c44,"Traffic":0xe8d059,"Sponsor Activations":0x6a61c7,"Preparty":0x42a89e
};
const roots=new Map();
function rootFor(layer){
  if(!roots.has(layer)){const g=new THREE.Group();g.name=layer;roots.set(layer,g);scene.add(g)}
  return roots.get(layer);
}
function material(layer){return new THREE.MeshStandardMaterial({color:palette[layer]||0x6e7886,roughness:.78,metalness:layer.includes("Fence")?.32:0})}
function segment(a,b,height,width,mat,parent){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz); if(len<.03)return;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(width,height,len),mat);
  mesh.position.set((a[0]+b[0])/2,height/2,(a[1]+b[1])/2);mesh.rotation.y=Math.atan2(dx,dz);
  mesh.castShadow=mesh.receiveShadow=true;parent.add(mesh);
}
function shapeMesh(path,layer,parent){
  const pts=path.points;if(pts.length<3)return false;
  const shape=new THREE.Shape();shape.moveTo(pts[0][0],-pts[0][1]);for(let i=1;i<pts.length;i++)shape.lineTo(pts[i][0],-pts[i][1]);
  const heights={"Stages":2.2,"Tents":.22,"Stretch Tents":.18,"Food":2.4,"Vendors":2.25,"Porta Potties _ Bathroom Trucks":2.6,"Parking":.04,"Park Infrastructure":.4,"Sponsor Activations":1.2,"Preparty":.25};
  const geo=new THREE.ExtrudeGeometry(shape,{depth:heights[layer]||.12,bevelEnabled:false});
  geo.rotateX(-Math.PI/2);
  const mesh=new THREE.Mesh(geo,material(layer));mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return true;
}
function makeLabel(text,x,z){
  const cv=document.createElement("canvas"),c=cv.getContext("2d");c.font="700 28px Segoe UI";const w=Math.ceil(c.measureText(text).width)+28;
  cv.width=w*2;cv.height=78;c.scale(2,2);c.fillStyle="#162538dc";c.fillRect(0,0,w,39);c.fillStyle="white";c.textAlign="center";c.textBaseline="middle";c.font="700 14px Segoe UI";c.fillText(text,w/2,20);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(Math.min(13,w/15),1.9,1);s.position.set(x,4,z);s.renderOrder=20;rootFor("Labels").add(s);
}
function isUsefulLabel(t){return /STAGE|LIMITLESS|VIP|GATE|BAR|FOOD|VENDOR|RESTROOM|BATHROOM|SOLAR|ENTRANCE|PARKING|LOUNGE|TENT|ADA|PRODUCTION|HOSPITAL|CAMP|COCONUT|INNERBASS|BUTWOOD|CREATION|REVIVAL/i.test(t)}

// Detailed assets reuse the proportions, colors, truss language, shade
// structures and signage from the original SSBD level. Their anchors stay CAD.
const detail=rootFor("Detailed assets");
const M={
  dark:new THREE.MeshStandardMaterial({color:0x252631,roughness:.84}),
  truss:new THREE.MeshStandardMaterial({color:0x7a8390,roughness:.45,metalness:.62}),
  gold:new THREE.MeshStandardMaterial({color:0xd9b24a,roughness:.42,metalness:.48}),
  canvas:new THREE.MeshStandardMaterial({color:0xf1eadb,roughness:.88,side:THREE.DoubleSide}),
  wood:new THREE.MeshStandardMaterial({color:0x8b6844,roughness:.92}),
  pink:new THREE.MeshStandardMaterial({color:0xd9358f,roughness:.58,emissive:0x52112f,emissiveIntensity:.24}),
  blue:new THREE.MeshStandardMaterial({color:0x3f8ecb,roughness:.75})
};
function addBox(g,w,h,d,x,y,z,mat=M.dark){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;g.add(m);return m}
function addPost(g,x,z,h=4,mat=M.truss){return addBox(g,.18,h,.18,x,h/2,z,mat)}
function peakedTent(x,z,w,d,rot,color=0xf1eadb){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const mat=color===0xf1eadb?M.canvas:new THREE.MeshStandardMaterial({color,roughness:.86,side:THREE.DoubleSide});
  const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute([
    -w/2,3,-d/2,w/2,3,-d/2,w/2,5,0,-w/2,3,-d/2,w/2,5,0,-w/2,5,0,
    -w/2,5,0,w/2,5,0,w/2,3,d/2,-w/2,5,0,w/2,3,d/2,-w/2,3,d/2
  ],3));geo.computeVertexNormals();const roof=new THREE.Mesh(geo,mat);roof.castShadow=true;g.add(roof);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3,M.truss);
  return g;
}
function stretchTentAsset(x,z,w,d,rot,color=0xe9dfc4){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const mat=new THREE.MeshStandardMaterial({color,roughness:.84,side:THREE.DoubleSide});
  const geo=new THREE.BufferGeometry(),verts=[],cols=8,rows=8;
  for(let iz=0;iz<=rows;iz++)for(let ix=0;ix<=cols;ix++){
    const px=(ix/cols-.5)*w,pz=(iz/rows-.5)*d;
    const nx=Math.abs(px)/(w/2),nz=Math.abs(pz)/(d/2);
    const y=3.15+2.35*(1-nx*nx)*(1-nz*nz)+.38*Math.sin(ix*Math.PI/cols)*Math.sin(iz*Math.PI/rows);
    verts.push(px,y,pz);
  }
  const idx=[];for(let iz=0;iz<rows;iz++)for(let ix=0;ix<cols;ix++){
    const a=iz*(cols+1)+ix,b=a+1,c=a+cols+1,d1=c+1;idx.push(a,c,b,b,c,d1);
  }
  geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();
  const canopy=new THREE.Mesh(geo,mat);canopy.castShadow=true;g.add(canopy);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3.15,M.truss);
  addPost(g,0,0,5.45,M.truss);return g;
}
function festivalStage(x,z,rot,w=24,d=13,butwood=false){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,1,d,0,.5,0,butwood?M.wood:M.dark);addBox(g,w,1.2,1,0,9,d/2-.5,butwood?M.wood:M.pink);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,9);
  addBox(g,w+.4,.24,.24,0,8.8,-d/2,M.truss);addBox(g,w+.4,.24,.24,0,8.8,d/2,M.truss);
  for(let i=-2;i<=2;i++){const lamp=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),new THREE.MeshStandardMaterial({color:0x26262e,emissive:i%2?0x20c8d8:0xd9358f,emissiveIntensity:2}));lamp.position.set(i*w/6,7.8,d/2+.2);g.add(lamp)}
  return g;
}
function rod(g,x1,y1,x2,y2,z,thick,mat){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),m=addBox(g,len,thick,thick,(x1+x2)/2,(y1+y2)/2,z,mat);
  m.rotation.z=Math.atan2(dy,dx);return m;
}
// Same Stage is deliberately its own model. The reference is a broad open
// scaffold wall, not the generic roofed festivalStage() box used in pass one.
function sameStageAsset(fp){
  // Exact minimum-area oriented footprint of DXF Stages/Group-70.
  const w=fp.width,d=fp.depth,h=fp.height;
  const g=new THREE.Group();g.name="THE SAME STAGE · CAD";
  g.position.set(fp.point[0],0,fp.point[1]);g.rotation.y=fp.rotation;detail.add(g);
  const orange=new THREE.MeshStandardMaterial({color:0xd58a27,roughness:.58,metalness:.34});
  const ivory=new THREE.MeshStandardMaterial({color:0xe8e4dc,roughness:.82});
  const black=new THREE.MeshStandardMaterial({color:0x101116,roughness:.7,metalness:.18});
  const screen=new THREE.MeshStandardMaterial({color:0x17131f,emissive:0x25103f,emissiveIntensity:.55,roughness:.5});

  addBox(g,w,1.15,d,0,.58,0,black);
  addBox(g,w*.46,h*.41,.45,0,h*.28,d*.30,screen);

  // Curved scaffold wall: 17 bays, higher end towers and the same shallow bow
  // visible in Peter's reference image.
  const wallZ=x=>d*.34-.018*x*x, wallH=x=>h*.79+Math.abs(x)*.22;
  for(let i=0;i<=16;i++){
    const bay=w/16,x=-w/2+i*bay,z=wallZ(x),wh=wallH(x);
    addBox(g,.16,wh,.16,x,wh/2,z,orange);
    for(let y=3.1;y<wh;y+=3.1)addBox(g,bay,.13,.13,x,y,z,orange);
    if(i<16&&i%2===0)rod(g,x,3.1,x+bay,6.2,z-.05,.12,orange);
    if(i<16&&i%2===1)rod(g,x,6.2,x+bay,3.1,z-.05,.12,orange);
  }

  // Patterned side towers: pale checker blocks with the black zigzag strokes
  // that define the real facade.
  for(const side of [-1,1]){
    const tx=side*w*.38;
    for(let c=0;c<4;c++)for(let r=0;r<7;r++){
      const pw=w*.063;
      const panel=addBox(g,pw,1.65,.28,tx+side*(c-1.5)*pw,2.1+r*1.68,wallZ(tx)-.35,
        (c+r)%3===0?black:ivory);
      panel.rotation.y=-side*.08;
    }
    const zx=side*w*.31;
    for(let k=0;k<6;k++){
      const y1=2.2+k*1.9,y2=y1+1.55;
      const run=w*.083;
      rod(g,zx+side*(k%2?0:run),y1,zx+side*(k%2?run:0),y2,wallZ(zx)-.7,.48,black);
    }
    // line array on the outside edge
    for(let j=0;j<8;j++)addBox(g,1.25,.56,1.05,side*(w/2-.7),h*.86-j*.63,d*.08+j*.08,black);
  }

  // Dense moving-light field across the scaffold and deck edge.
  const lampMatA=new THREE.MeshStandardMaterial({color:0x24252c,emissive:0x56d7ee,emissiveIntensity:1.8});
  const lampMatB=new THREE.MeshStandardMaterial({color:0x24252c,emissive:0xd9358f,emissiveIntensity:1.8});
  for(let i=0;i<32;i++){
    const x=-w*.43+(i%16)*(w*.86/15),y=3.0+Math.floor(i/16)*4.3+(i%3)*1.15;
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),i%2?lampMatA:lampMatB);
    lamp.position.set(x,y,wallZ(x)-.55);g.add(lamp);
  }
  for(let i=-5;i<=5;i++){
    const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.48,8),i%2?lampMatA:lampMatB);
    lamp.position.set(i*w/12,1.5,-d*.42);lamp.rotation.x=-.9;g.add(lamp);
  }
  makeLabel("THE SAME STAGE",fp.point[0],fp.point[1]);
  return g;
}
function limitlessAssets(data,deckFp,loungeFp){
  const deck=new THREE.Group();deck.position.set(deckFp.x,0,deckFp.z);deck.rotation.y=deckFp.rot;detail.add(deck);
  const deckW=32*.3048,deckD=20*.3048;
  addBox(deck,deckW,.36,deckD,0,4,0,M.dark);
  for(const [x,z] of [[-deckW*.41,-deckD*.4],[deckW*.41,-deckD*.4],[-deckW*.41,deckD*.4],[deckW*.41,deckD*.4],[0,0]])addPost(deck,x,z,3.9);
  for(const [x,z,w,d] of [[0,-deckD/2,deckW,.12],[-deckW/2,0,.12,deckD],[0,deckD/2,deckW,.12]])addBox(deck,w,.9,d,x,4.8,z,M.gold);
  const lounge=new THREE.Group();lounge.position.set(loungeFp.x,0,loungeFp.z);lounge.rotation.y=loungeFp.rot;detail.add(lounge);
  const loungeW=40*.3048,loungeD=20*.3048;
  addBox(lounge,loungeW,.22,loungeD,0,3.55,0,M.dark);
  for(const x of [-loungeW*.45,0,loungeW*.45])for(const z of [-loungeD*.45,loungeD*.45])addPost(lounge,x,z,3.5);
  addBox(lounge,loungeW*.73,.1,loungeD*.66,0,.06,0,new THREE.MeshStandardMaterial({color:0x322545,roughness:1}));
  addBox(lounge,loungeW*.32,1.1,.9,0,.55,loungeD*.35,M.gold);
  const solarAnchor=data.anchors.find(a=>a.text==="SOLAR / x3"),solar=[];
  if(solarAnchor)for(const path of data.paths){
    if(path.layer!=="Porta Potties _ Bathroom Trucks"||!path.closed)continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1.8||fp.w>3||fp.d<1||fp.d>2)continue;
    const dist=Math.hypot(fp.x-solarAnchor.point[0],fp.z-solarAnchor.point[1]);if(dist<10)solar.push({dist,...fp});
  }
  solar.sort((a,b)=>a.dist-b.dist);
  for(const fp of solar.slice(0,3)){
    const u=new THREE.Group();u.position.set(fp.x,0,fp.z);u.rotation.y=fp.rot;detail.add(u);
    addBox(u,fp.w,2.9,fp.d,0,1.45,0,M.blue);
    const pv=addBox(u,fp.w+.12,.09,Math.max(.9,fp.d-.12),0,3.12,0,new THREE.MeshStandardMaterial({color:0x17243b,roughness:.25,metalness:.5}));pv.rotation.x=-.15;
  }
}
function barAsset(x,z,rot,w,d){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,1.15,d,0,.58,0,M.wood);addBox(g,w+.12,.2,d+.12,0,1.22,0,M.gold);
  for(const px of [-w/2,w/2])for(const pz of [-d/2,d/2])addPost(g,px,pz,3.2);
  addBox(g,w+.25,.18,.2,0,3.15,-d/2,M.pink);return g;
}
function pdfSizedAsset(anchor,wFeet,dFeet,builder,label,rotationOffset=0){
  if(!anchor)return null;
  const w=wFeet*.3048,d=dFeet*.3048,rot=anchor.rotation+rotationOffset;
  const asset=builder(anchor.point[0],anchor.point[1],rot,w,d);
  if(label)makeLabel(label,anchor.point[0],anchor.point[1]);
  return asset;
}
function stallAsset(x,z,rot,w,d,food){
  const g=new THREE.Group(),col=food?0xf0a34a:0xdb4f93;g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,2.5,d,0,1.25,0,new THREE.MeshStandardMaterial({color:col,roughness:.8}));
  addBox(g,w+.18,.22,d+.18,0,2.68,0,M.canvas);addBox(g,w*.66,.9,.18,0,1.6,-d/2-.02,M.dark);
}
function serviceAsset(x,z,rot,w,d,color=0xe7e1d6){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  const wall=new THREE.MeshStandardMaterial({color,roughness:.88});
  addBox(g,w,2.65,d,0,1.33,0,wall);
  addBox(g,w+.16,.18,d+.16,0,2.76,0,M.dark);
  addBox(g,Math.min(1.05,w*.32),2,.08,0,1.08,-d/2-.045,M.blue);
  return g;
}
function entranceAsset(x,z,rot,name){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  for(const px of [-5.5,5.5]){addBox(g,1.1,8,1.1,px,4,0,M.truss);addBox(g,1.45,.42,1.45,px,8.25,0,M.gold)}
  addBox(g,12.1,.75,.75,0,7.6,0,M.truss);addBox(g,9.5,1.25,.34,0,6.9,-.4,M.pink);
  for(let i=-2;i<=2;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),new THREE.MeshStandardMaterial({color:0x302b35,emissive:i%2?0x29d3c6:0xffd166,emissiveIntensity:2}));l.position.set(i*1.8,7.55,.5);g.add(l)}
  makeLabel(name,x,9.8,z);
}
function restroomAsset(x,z,rot,count=3){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  for(let i=0;i<count;i++){const u=new THREE.Group();u.position.x=(i-(count-1)/2)*2.35;g.add(u);addBox(u,2,2.7,2,0,1.35,0,M.blue);addBox(u,2.2,.16,2.2,0,2.78,0,M.dark);addBox(u,.85,1.95,.08,0,1.08,-1.02,new THREE.MeshStandardMaterial({color:0x286a99,roughness:.85}))}
}
function restroomTrailer(x,z,rot,w,d){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detail.add(g);
  addBox(g,w,3.05,d,0,1.53,0,new THREE.MeshStandardMaterial({color:0xf3f0e7,roughness:.8}));
  addBox(g,w+.15,.16,d+.15,0,3.12,0,M.dark);
  for(let i=-1;i<=1;i++){
    const door=addBox(g,w*.22,2.18,.08,i*w*.27,1.2,-d/2-.045,M.blue);
    addBox(g,.09,.09,.1,i*w*.27+w*.075,1.2,-d/2-.11,M.gold);
  }
  for(const x1 of [-w*.43,w*.43]){addBox(g,.14,.14,d*.5,x1,.07,d*.73,M.truss);addBox(g,.14,.14,d*.5,x1,.07,-d*.73,M.truss)}
}
function restroomFootprintAsset(fp){
  const g=new THREE.Group();g.position.set(fp.x,0,fp.z);g.rotation.y=fp.rot;detail.add(g);
  const area=fp.w*fp.d;
  if(area<1.1||fp.d<.82){
    // Compact hand-wash symbol.
    addBox(g,fp.w,1.05,fp.d,0,.53,0,new THREE.MeshStandardMaterial({color:0xd7e5e8,roughness:.72}));
    for(const x of [-fp.w*.28,fp.w*.28])addBox(g,.12,.28,.18,x,1.18,0,M.truss);
    return;
  }
  const h=area<5?2.72:3.0;
  addBox(g,fp.w,h,fp.d,0,h/2,0,M.blue);
  addBox(g,fp.w+.12,.15,fp.d+.12,0,h+.08,0,M.dark);
  const doors=Math.max(1,Math.min(5,Math.round(fp.w/1.15)));
  for(let i=0;i<doors;i++){
    const x=(i-(doors-1)/2)*(fp.w*.78/doors);
    addBox(g,Math.min(.82,fp.w*.68/doors),h*.68,.07,x,h*.39,-fp.d/2-.04,new THREE.MeshStandardMaterial({color:0x286a99,roughness:.85}));
  }
}

function pathFootprint(path){
  const pts=path.points.slice(0,-1);if(pts.length<3)return null;
  const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length,cz=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  let edge=[1,0],longest=0;
  for(let i=0;i<pts.length;i++){const q=pts[(i+1)%pts.length],dx=q[0]-pts[i][0],dz=q[1]-pts[i][1],len=Math.hypot(dx,dz);if(len>longest){longest=len;edge=[dx/len,dz/len]}}
  const side=[-edge[1],edge[0]],us=pts.map(p=>p[0]*edge[0]+p[1]*edge[1]),vs=pts.map(p=>p[0]*side[0]+p[1]*side[1]);
  return {x:cx,z:cz,w:Math.max(...us)-Math.min(...us),d:Math.max(...vs)-Math.min(...vs),rot:Math.atan2(-edge[1],edge[0])};
}
function exactFootprint(data,anchor,layer,maxDist=12){
  let best=null,bestDist=Infinity;
  for(const path of data.paths){
    if(path.layer!==layer||!path.closed||path.points.length<4)continue;
    const fp=pathFootprint(path);if(!fp)continue;
    const dist=Math.hypot(fp.x-anchor.point[0],fp.z-anchor.point[1]);if(dist>=bestDist)continue;
    bestDist=dist;best=fp;
  }
  return bestDist<maxDist?best:null;
}
function buildDetailedAssets(data){
  const insert=(name)=>data.inserts.find(i=>i.name===name&&i.bounds)?.bounds;
  const anchor=(text)=>data.anchors.find(a=>a.text===text);
  const namedFootprint=(text,layer,maxDist=12)=>{
    const a=anchor(text);return a?exactFootprint(data,a,layer,maxDist):null;
  };
  const exactAnchor=(text,point)=>{
    const matches=data.anchors.filter(a=>a.text===text);
    if(!point)return matches[0]||null;
    return matches.sort((a,b)=>Math.hypot(a.point[0]-point[0],a.point[1]-point[1])-Math.hypot(b.point[0]-point[0],b.point[1]-point[1]))[0]||null;
  };
  const usedTents=[];
  const useTent=(fp)=>usedTents.push([fp.x,fp.z]);
  const tentUsed=(fp,dist=5)=>usedTents.some(p=>Math.hypot(p[0]-fp.x,p[1]-fp.z)<dist);
  const same=insert("Group-70");
  if(same)sameStageAsset(same);
  const but=namedFootprint("THE BUT STAGE","Stage-Main");
  if(but)festivalStage(but.x,but.z,but.rot,but.w,but.d,true);
  const deck=namedFootprint("LIMITLESS / VIEWING / DECK 32'x20","Stages");
  const lounge=namedFootprint("LIMITLESS / LOUNGE / 40x20","None",20);
  if(deck&&lounge)limitlessAssets(data,deck,lounge);
  const vip=namedFootprint("VIP LOUNGE","Tents");
  if(vip){peakedTent(vip.x,vip.z,50*.3048,30*.3048,vip.rot);useTent(vip)}
  const revival=insert("Event Tent 40x60 Event 2 (2D)");
  if(revival)peakedTent(revival.point[0],revival.point[1],revival.width,revival.depth,revival.rotation,0xd8c7ef);
  // Named CAD structures: center and rotation come from their closed outline;
  // printed dimensions override only the decorative overhang in the symbol.
  const coconut=namedFootprint("COCONUT COVE / STRETCH TENT / 130'","Stretch Tents");
  if(coconut){stretchTentAsset(coconut.x,coconut.z,coconut.w,coconut.d,coconut.rot);useTent(coconut)}
  const inner=namedFootprint("INNERBASS / STRETCH TENT / 130'","Stretch Tents");
  if(inner){stretchTentAsset(inner.x,inner.z,inner.w,inner.d,inner.rot,0xd9c8ea);useTent(inner)}
  const merch=namedFootprint("FESTIVAL / MERCH / 10x40","Tents");
  if(merch){peakedTent(merch.x,merch.z,40*.3048,10*.3048,merch.rot,0xe9dce8);useTent(merch)}
  const chapel=namedFootprint("CHAPEL / / / / / / / / / / / / / / / / / / / / / / / / / / / / 20x30","Tents");
  if(chapel){peakedTent(chapel.x,chapel.z,30*.3048,20*.3048,chapel.rot);useTent(chapel)}
  const art=namedFootprint("ART SALES / TENT / 10x10","Tents");
  if(art){peakedTent(art.x,art.z,10*.3048,10*.3048,art.rot,0xe7d5b9);useTent(art)}
  const extra=namedFootprint("ADDTL / 40x40 / STRETCH / TENT","Stretch Tents");
  if(extra){stretchTentAsset(extra.x,extra.z,40*.3048,40*.3048,extra.rot);useTent(extra)}
  const innerStage=namedFootprint("INNERBASS STAGE / 16' x 12'","Stages");
  if(innerStage)festivalStage(innerStage.x,innerStage.z,innerStage.rot,16*.3048,12*.3048);
  const coconutStageAnchor=data.anchors.find(a=>a.text.toUpperCase().startsWith("STAGE /")&&a.point[0]>150);
  const coconutStage=coconutStageAnchor?exactFootprint(data,coconutStageAnchor,"Stages",18):null;
  if(coconutStage)festivalStage(coconutStage.x,coconutStage.z,coconutStage.rot,coconutStage.w,coconutStage.d);
  const coconutBar=namedFootprint("Coconut Cove Bar","Stages");
  if(coconutBar)barAsset(coconutBar.x,coconutBar.z,coconutBar.rot,coconutBar.w,coconutBar.d);
  // These three bars are PDF annotations rather than closed DXF polygons.
  // Their centers and orientation come from the DXF text entities; dimensions
  // come only from the printed PDF callouts. Bar 6 has no printed dimensions,
  // so it remains a labelled CAD marker until a physical footprint is supplied.
  pdfSizedAsset(anchor("BAR 1"),30,20,barAsset,"BAR 1");
  pdfSizedAsset(anchor("BAR 2"),10,40,barAsset,"BAR 2");
  const bar6=anchor("BAR 6");if(bar6)makeLabel("BAR 6 · FOOTPRINT PENDING",bar6.point[0],bar6.point[1]);
  const east=anchor("ENTRANCE"),west=data.anchors.find(a=>a.text==="ENTRANCE"&&a!==east);
  if(east)entranceAsset(east.point[0],east.point[1],east.rotation,"EAST ENTRANCE");
  if(west)entranceAsset(west.point[0],west.point[1],west.rotation,"WEST ENTRANCE");
  // PDF sheet: ADA Viewing is explicitly 12' x 8'. The DXF provides separate
  // ADA and VIEWING text entities at the platform. Use their midpoint rather
  // than the earlier eyeballed center.
  const viewA=anchor("VIEWING"),adaA=viewA?exactAnchor("ADA",viewA.point):null;
  if(adaA&&viewA){
    const mid={point:[(adaA.point[0]+viewA.point[0])/2,(adaA.point[1]+viewA.point[1])/2],rotation:viewA.rotation};
    pdfSizedAsset(mid,12,8,adaDeck,"ADA VIEWING");
  }
  // Both FOH footprints are explicitly dimensioned on the PDF. They are text
  // annotations rather than closed CAD polygons, so use the dimension entity's
  // insertion point and rotation.
  const sameFoh=exactAnchor("20 x 20",[64.6564,65.5089]);
  if(sameFoh)pdfSizedAsset(sameFoh,20,20,fohAsset,"SAME STAGE FOH");
  const coveFoh=exactAnchor("FOH / 10 x 10",[199.0277,-28.6668]);
  if(coveFoh)pdfSizedAsset(coveFoh,10,10,fohAsset,"COCONUT COVE FOH");

  // PDF-verified support footprints. These are dimension annotations placed
  // inside their rectangles in the CAD, so the annotation insertion supplies
  // center/rotation while the printed dimensions supply size.
  const pdfBlocks=[
    ["20 x 20",[-31.0424,-65.9352],20,20,"SUSTAINABILITY TENT","tent"],
    ["10 X 20",[122.9776,-92.6682],10,20,"GUEST SERVICES / ADA","service"],
    ["10 x 20",[118.2844,-76.6623],10,20,"ICE SALES","service"],
    ["20 x 20",[122.9066,-101.9584],20,20,"VOLUNTEER","tent"],
    ["10 x 20",[170.4453,-35.5087],10,20,"INNERSPACE GREEN ROOM","service"],
    ["10 x 20",[112.2525,-120.1887],10,20,"SECURITY HQ","service"],
    ["10 x 20",[-46.8326,147.2966],10,20,"BUT STAGE GREEN ROOM","service"],
    ["10 x 20",[94.2229,-66.8308],10,20,"PEER SUPPORT","tent"],
    ["20 x 20",[85.8825,-58.6118],20,20,"FIRST AID","tent"],
    ["24x24 / HOSP / STORAGE",[24.5239,3.8007],24,24,"HOSPITAL STORAGE","service"],
    ["10 x 20",[27.0419,80.0681],10,20,"VIP BAR STORAGE","service"],
    ["10 x 20",[64.7082,22.0797],10,20,"BAR STORAGE","service"],
    ["10 x 20",[219.62,160.1731],10,20,"COCONUT COVE BAR STORAGE","service"],
    ["10 x 10",[103.5042,-41.742],10,10,"BAR 5 STORAGE","service"]
  ];
  for(const [text,near,w,d,label,kind] of pdfBlocks){
    const a=exactAnchor(text,near);if(!a)continue;
    if(kind==="tent"){
      peakedTent(a.point[0],a.point[1],w*.3048,d*.3048,a.rotation);
      makeLabel(label,a.point[0],a.point[1]);
    }
    else pdfSizedAsset(a,w,d,serviceAsset,label,0);
  }
  const placed=[];for(const a of data.anchors){const food=/^FOOD(?: TRUCK)?$/i.test(a.text),vendor=/^VENDORS?$/i.test(a.text);if(!food&&!vendor)continue;
    const fp=exactFootprint(data,a,food?"Food":"Vendors");if(!fp||placed.some(p=>Math.hypot(p[0]-fp.x,p[1]-fp.z)<2))continue;
    placed.push([fp.x,fp.z]);stallAsset(fp.x,fp.z,fp.rot,fp.w,fp.d,food)}
  // Every remaining tent uses its closed DXF outline. Skip the two named tents
  // above so they are not drawn twice.
  for(const path of data.paths){
    if(!path.closed||!(path.layer==="Tents"||path.layer==="Stretch Tents"))continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1.5||fp.d<1.5||fp.w>45||fp.d>45)continue;
    if(tentUsed(fp,8)||Math.hypot(fp.x-.9549,fp.z-112.7312)<8)continue;
    peakedTent(fp.x,fp.z,fp.w,fp.d,fp.rot,path.layer==="Stretch Tents"?0xe9dfc4:0xf1eadb);
  }
  // Block inserts carry their own CAD rotation and minimum-area bounds. These
  // cannot be placed from nearby labels: several labels are tens of metres away.
  for(const item of data.inserts){
    const fp=item.bounds;if(!fp||Math.abs(fp.point[0])>500||Math.abs(fp.point[1])>500)continue;
    if(/^Event Tent /i.test(item.name)){
      if(item.name==="Event Tent 40x60 Event 2 (2D)")continue;
      peakedTent(fp.point[0],fp.point[1],fp.width,fp.depth,fp.rotation);
    }else if(/^Vehicle Mobile Restroom Trailer/i.test(item.name)){
      restroomTrailer(fp.point[0],fp.point[1],fp.rotation,fp.width,fp.depth);
    }
  }
  // Every restroom/porto/hand-wash footprint is a literal closed CAD outline.
  // Style varies by physical size, but position, rotation, width and depth do not.
  const trailer=insert("Vehicle Mobile Restroom Trailer 3 Doors (2D)");
  const solarAnchor=anchor("SOLAR / x3");
  for(const path of data.paths){
    if(path.layer!=="Porta Potties _ Bathroom Trucks"||!path.closed)continue;
    const fp=pathFootprint(path);if(!fp||fp.w<=.01||fp.d<=.01||fp.w>18||fp.d>12)continue;

  // footprints without inventing another full-height stage roof.
  for(const path of data.paths){
    if(path.layer!=="Stages"||!path.closed)continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1.4||fp.d<1||fp.w>20||fp.d>15)continue;

    if(coconutStage&&Math.hypot(fp.x-coconutStage.x,fp.z-coconutStage.z)<5)continue;

    if(!path.closed||!(path.layer==="Sponsor Activations"||path.layer==="Preparty"||path.layer==="Park Infrastructure"))continue;
    const fp=pathFootprint(path);if(!fp||fp.w<1||fp.d<1||fp.w>40||fp.d>40||Math.abs(fp.x)>500||Math.abs(fp.z)>500)continue;
    activationAsset(fp,path.layer==="Park Infrastructure"?0xc7ad77:path.layer==="Preparty"?0x7655b5:0xd9358f);
  }
}

fetch("site-plan.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
  for(const path of data.paths){
    const layer=path.layer,parent=rootFor(layer),fence=/FENCE|Bike Rack/.test(layer);
    if(layer==="Group Camping"||layer==="But Area"||layer==="Stage-Main"||layer==="None"||layer==="CRASH BARRICADE")continue;
    if(path.closed&&!fence&&shapeMesh(path,layer,parent))continue;
    const h=layer==="SCRIM 8' FENCE"?2.45:layer==="Bike Rack"?1.05:fence?1.85:.18;
    const w=layer==="Bike Rack"?.08:fence?.11:.16,mat=material(layer);
    for(let i=1;i<path.points.length;i++)segment(path.points[i-1],path.points[i],h,w,mat,parent);
  }
  const seen=[];for(const a of data.anchors){if(!isUsefulLabel(a.text))continue;if(seen.some(p=>Math.hypot(p[0]-a.point[0],p[1]-a.point[1])<2))continue;seen.push(a.point);makeLabel(a.text,a.point[0],a.point[1])}
  buildDetailedAssets(data);
  buildLayerPanel();
  document.querySelector("#status").textContent=`${data.stats.entities} DXF entities · ${data.stats.paths} paths · ${data.stats.anchors} labels`;
  festivalView();
}).catch(e=>document.querySelector("#status").textContent="CAD load failed: "+e.message);

function buildLayerPanel(){
  const box=document.querySelector("#layers");
  const hiddenByDefault=new Set(["But Area","CRASH BARRICADE","Food","Group Camping","None","Park Infrastructure","Parking","Porta Potties _ Bathroom Trucks","Preparty","Sponsor Activations","Stage-Main","Stages","Stretch Tents","Tents","Vendors"]);
  [...roots.keys()].sort().forEach(layer=>{const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=!hiddenByDefault.has(layer);
    roots.get(layer).visible=input.checked;
    input.onchange=()=>roots.get(layer).visible=input.checked;label.append(input,document.createTextNode(layer));box.append(label)});
}

let yaw=0,pitch=-.32;const keys={};
// Viewpoint requested by Peter: standing at Limitless and looking into the
// festival. Solar is behind; Butwood is right; food and East Entrance are left.
function festivalView(){camera.position.set(2.9,14,43.1);yaw=-1.30;pitch=-.24}
function overview(){camera.position.set(30,430,35);yaw=0;pitch=-Math.PI/2+.001}
document.querySelector("#overview").onclick=overview;document.querySelector("#spawn").onclick=festivalView;
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),dir=new THREE.Vector3(),right=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04),turn=1.25*dt;
  if(keys.ArrowLeft)yaw+=turn;if(keys.ArrowRight)yaw-=turn;if(keys.ArrowUp)pitch+=turn;if(keys.ArrowDown)pitch-=turn;
  pitch=THREE.MathUtils.clamp(pitch,-1.56,1.25);camera.rotation.order="YXZ";camera.rotation.set(pitch,yaw,0);
  camera.getWorldDirection(dir);right.crossVectors(dir,camera.up).normalize();const speed=(keys.ShiftLeft||keys.ShiftRight?95:30)*dt;
  if(keys.KeyW)camera.position.addScaledVector(dir,speed);if(keys.KeyS)camera.position.addScaledVector(dir,-speed);
  if(keys.KeyA)camera.position.addScaledVector(right,-speed);if(keys.KeyD)camera.position.addScaledVector(right,speed);
  if(keys.KeyE)camera.position.y+=speed;if(keys.KeyQ)camera.position.y-=speed;
  renderer.render(scene,camera);
}
tick();
